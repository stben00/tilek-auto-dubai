  // Specs grid
  const body = BODY_MAP[String(car.bodyType || car.body || '').toLowerCase()] || car.bodyType || car.body || '';
  const specs = [
    car.year && {label:'Год выпуска', value: car.year},
    car.engine && {label:'Двигатель', value: car.engine},
    fuel && {label:'Топливо', value: fuel},
    {label:'Коробка', value: car.transmission || 'Automatic'},
    car.mileage && {label:'Пробег', value: car.mileage},
    body && {label:'Кузов', value: body},

  // Price
  const priceRaw = String(car.price || '').trim();
  const hasPrice = priceRaw && priceRaw.toLowerCase() !== 'по запросу';
  const priceShown = hasPrice ? escapeHtml(priceRaw) : 'По запросу';
  const priceLabel = hasPrice ? 'Цена в Дубае' : 'Цена';
  const priceNote = hasPrice
    ? 'Финальный расчёт с доставкой в Бишкек/Алматы — по запросу. Под ключ считаем индивидуально.'
    : 'Напишите в WhatsApp — пришлём расчёт под ключ с доставкой.';

  // WhatsApp message
  const waMsg = `Здравствуйте! Интересует ${car.title || (car.brand + ' ' + (car.model || ''))}. Можно получить полный расчёт под ключ с доставкой?`;

  // Video setup
  const videoUrl = String(car.videoUrl || car.videoFile || '').trim();
  const videoType = car.videoType || (videoUrl
    ? (/youtube|youtu\.be/i.test(videoUrl) ? 'youtube'
       : (/instagram/i.test(videoUrl) ? 'instagram'
       : (/\.(mp4|mov|webm|m4v)(\?|$)/i.test(videoUrl) ? 'local' : 'external')))
    : '');

  // Gallery HTML — iOS Safari-safe (eager loading, inline SVG fallback so
  // the layout never collapses and the photo never silently disappears).
  const _carImgFallback = encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice">' +
    '<rect width="320" height="200" fill="#1a1a1a"/>' +
    '<text x="160" y="100" text-anchor="middle" dominant-baseline="middle" ' +
    'font-family="system-ui,sans-serif" font-size="14" fill="#666">Фото скоро будет</text>' +
    '</svg>'
  );
  const _carImgOnError = `this.onerror=null;this.src='data:image/svg+xml;charset=utf-8,${_carImgFallback}';`;

  const galleryHTML = images.length ? `
    <div class="gallery-main">
      <img src="${escapeAttr(images[0])}" alt="${title}" id="galleryMain"
           loading="eager" fetchpriority="high" decoding="async"
           onerror="${_carImgOnError}">
      ${images.length > 1 ? `
        <button type="button" class="gallery-nav gallery-prev" id="gPrev" aria-label="Предыдущее">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button type="button" class="gallery-nav gallery-next" id="gNext" aria-label="Следующее">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div class="gallery-counter" id="gCounter">1 / ${images.length}</div>
      ` : ''}
      ${videoUrl ? `
        <button type="button" class="gallery-video-btn" id="openVideo">
          ${ICO.play} Смотреть видео
        </button>
      ` : ''}
    </div>
    ${images.length > 1 ? `
      <div class="gallery-thumbs" id="gThumbs">
        ${images.map((src, i) => `
          <button type="button" class="gallery-thumb ${i === 0 ? 'active' : ''}" data-idx="${i}">
            <img src="${escapeAttr(src)}" alt="${title} фото ${i+1}" loading="lazy">
          </button>
        `).join('')}
      </div>
    ` : ''}
  ` : `
    <div class="gallery-main">
      <div class="gallery-empty">Фото будут добавлены позже</div>
    </div>
  `;

  // Description
  const description = (car.description || '').trim();
  const descriptionHTML = description ? `
    <div class="description-block">
      <h3>${ICO.check} Описание автомобиля</h3>
      <p>${escapeHtml(description)}</p>
    </div>
  ` : '';

  // Poster block (only if poster exists and is different from images[0])
  const posterHTML = poster && poster !== images[0] ? `
    <div class="poster-block">
      <img src="${escapeAttr(poster)}" alt="${title} — постер для соцсетей">
      <div>
        <h3>Постер для соцсетей</h3>
        <p>Готовая рекламная карточка этого авто для отправки в WhatsApp, Instagram или Telegram.</p>
        <a href="${escapeAttr(poster)}" download class="btn btn-ghost">Скачать постер</a>
      </div>
    </div>
  ` : '';

  document.title = `${car.title} — Tilek Auto Dubai`;
  document.getElementById('carPageDesc').setAttribute('content',
    `${car.title}${hasPrice ? ' — ' + priceRaw : ''}. Доставка из Дубая под ключ. WhatsApp +996 551 333 360.`);
  document.getElementById('ogTitle').setAttribute('content', `${car.title} — Tilek Auto Dubai`);
  document.getElementById('ogDesc').setAttribute('content',
    `Авто из Дубая под заказ. ${[car.year, car.engine, fuel].filter(Boolean).join(' · ')}. ${hasPrice ? priceRaw : 'Цена по запросу'}.`);
  if (images[0]) {
    document.getElementById('ogImage').setAttribute('content',
      new URL(images[0], window.location.href).href);
  }
  document.getElementById('bcTitle').textContent = car.title;
  document.getElementById('stickyWA').href = makeWhatsappUrl(waMsg);

  document.getElementById('carRoot').innerHTML = `
    <div class="car-hero">
      <div class="gallery">
        ${galleryHTML}
      </div>
      <aside class="car-info">
        ${statusLabel ? `<span class="car-status status-${statusKey}">${escapeHtml(statusLabel)}</span>` : ''}
        <h1>${title}</h1>
        ${subParts.length ? `<div class="car-subline">${subParts.map(p => escapeHtml(p)).join('<span class="sep">·</span>')}</div>` : ''}
        ${specs.length ? `
          <div class="spec-grid">
            ${specs.map(s => `
              <div class="spec-item">
                <div class="spec-label">${escapeHtml(s.label)}</div>
                <div class="spec-value">${escapeHtml(s.value)}</div>
              </div>
            `).join('')}
          </div>
        ` : ''}
        <div class="price-block">
          <div class="price-label">${priceLabel}</div>
          <div class="price-big">${priceShown}</div>
          <div class="price-note">${priceNote}</div>
        </div>
        <div class="actions">
          <a href="${makeWhatsappUrl(waMsg)}" target="_blank" rel="noopener" class="btn btn-whatsapp">
            ${ICO.wa} Написать в WhatsApp
          </a>
          <a href="${makeWhatsappUrl('Здравствуйте! Хочу получить полный расчёт под ключ для ' + (car.title || 'этого авто') + '.')}" target="_blank" rel="noopener" class="btn btn-gold">
            Получить расчёт под ключ
          </a>
          ${videoUrl ? `
            <button type="button" class="btn btn-ghost" id="openVideoBtn2">
              ${ICO.play} Смотреть видео
            </button>
          ` : ''}
        </div>
      </aside>
    </div>

    <div class="trust-block">
      <div class="trust-item">
        <div class="trust-icon">${ICO.shield}</div>
        <div class="trust-text">
          <h4>Проверка перед покупкой</h4>
          <p>Осмотр кузова, технического состояния и истории до сделки.</p>
        </div>
      </div>
      <div class="trust-item">
        <div class="trust-icon">${ICO.video}</div>
        <div class="trust-text">
          <h4>Видеоосмотр по запросу</h4>
          <p>Снимем подробное видео по нужным деталям — оплата только после согласования.</p>
        </div>
      </div>
      <div class="trust-item">
        <div class="trust-icon">${ICO.truck}</div>
        <div class="trust-text">
          <h4>Доставка под ключ</h4>
          <p>Растаможка, документы, доставка в Бишкек, Алматы, Астану — без скрытых сборов.</p>
        </div>
      </div>
    </div>

    ${descriptionHTML}
    ${posterHTML}
  `;

  // Gallery interactions
  if (images.length > 1) {
    let currentIdx = 0;
    const mainImg = document.getElementById('galleryMain');
    const counter = document.getElementById('gCounter');
    const thumbs = document.querySelectorAll('.gallery-thumb');
    function setIdx(i) {
      currentIdx = (i + images.length) % images.length;
      mainImg.src = images[currentIdx];
      counter.textContent = `${currentIdx + 1} / ${images.length}`;
      thumbs.forEach((t, idx) => t.classList.toggle('active', idx === currentIdx));
    }
    document.getElementById('gPrev').addEventListener('click', () => setIdx(currentIdx - 1));
    document.getElementById('gNext').addEventListener('click', () => setIdx(currentIdx + 1));
    thumbs.forEach(t => t.addEventListener('click', () => setIdx(+t.dataset.idx)));
    // keyboard arrows
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') setIdx(currentIdx - 1);
      if (e.key === 'ArrowRight') setIdx(currentIdx + 1);
    });
  }

  // Video modal
  if (videoUrl) {
    const openVideo = () => openVideoModal(videoUrl, videoType, car.videoPoster || images[0]);
    const openBtn = document.getElementById('openVideo');
    const openBtn2 = document.getElementById('openVideoBtn2');
    if (openBtn) openBtn.addEventListener('click', openVideo);
    if (openBtn2) openBtn2.addEventListener('click', openVideo);
  }
}

// ===== Video modal logic =====
function openVideoModal(url, type, poster) {
  const modal = document.getElementById('vmodal');
  const player = document.getElementById('vmodalPlayer');
  let html = '';
  if (type === 'local') {
    html = `<video src="${escapeAttr(url)}" poster="${escapeAttr(poster || '')}" controls autoplay playsinline></video>`;
  } else if (type === 'youtube') {
    const m = url.match(/(?:youtu\.be\/|v=|\/embed\/)([\w-]{11})/);
    const id = m ? m[1] : '';
    if (id) html = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  } else if (type === 'instagram') {
    const m = url.match(/instagram\.com\/(?:p|reel|tv)\/([\w-]+)/);
    const id = m ? m[1] : '';
    if (id) html = `<iframe src="https://www.instagram.com/p/${id}/embed/" allowtransparency="true" allowfullscreen></iframe>`;
  }
  if (!html) {
    window.open(url, '_blank', 'noopener');
    return;
  }
  player.innerHTML = html;
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';
}
function closeVideoModal() {
  const modal = document.getElementById('vmodal');
  document.getElementById('vmodalPlayer').innerHTML = '';
  modal.classList.remove('active');
  document.body.style.overflow = '';
}
document.getElementById('vmodalClose').addEventListener('click', closeVideoModal);
document.getElementById('vmodal').addEventListener('click', e => { if (e.target.id === 'vmodal') closeVideoModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeVideoModal(); });

// ===== Boot =====
(function loadCar() {
  const carId = getQueryId();
  if (!carId) {
    document.getElementById('carRoot').innerHTML = `
      <div class="error">
        <h2>Не указан автомобиль</h2>
        <p>Откройте каталог и выберите интересующий автомобиль.</p>
        <a href="index.html#catalog" class="btn btn-gold">Перейти в каталог</a>
      </div>`;
    return;
  }
  fetch('data/site-data.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject('Не удалось загрузить данные'))
    .then(site => {
      const car = (site.cars || []).find(c => String(c.id) === String(carId));
      if (!car) {
        document.getElementById('carRoot').innerHTML = `
          <div class="error">
            <h2>Автомобиль не найден</h2>
            <p>Возможно, он уже продан или ссылка устарела.</p>
            <a href="index.html#catalog" class="btn btn-gold">Посмотреть другие авто</a>
          </div>`;
        return;
      }
      renderCar(car);
    })
    .catch(err => {
      console.error(err);
      document.getElementById('carRoot').innerHTML = `
        <div class="error">
          <h2>Не удалось загрузить</h2>
          <p>Проверьте соединение и обновите страницу.</p>
          <a href="index.html#catalog" class="btn btn-gold">Вернуться в каталог</a>
        </div>`;
    });
})();
</script>
