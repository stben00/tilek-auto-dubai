  <path d="M7,-17 Q14,-8 12,2" stroke="#FFDDB8" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <circle cx="-6" cy="10" r="1.5" fill="#C8A0E0" opacity="0.7"/>
  <circle cx="6" cy="20" r="1.5" fill="#C8A0E0" opacity="0.7"/>
</g>

