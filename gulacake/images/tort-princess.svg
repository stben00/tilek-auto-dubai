  <circle cx="-8" cy="12" r="1.5" fill="#FFEEBB" opacity="0.7"/>
  <circle cx="8" cy="20" r="1.5" fill="#FFEEBB" opacity="0.7"/>
  <circle cx="0" cy="28" r="2" fill="#FFEEBB" opacity="0.6"/>
</g>

