<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FBE8F0"/>
    <stop offset="100%" stop-color="#F5D8E8"/>
  </linearGradient>
  <linearGradient id="cakeBody" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#E878A0"/>
    <stop offset="50%" stop-color="#DC6898"/>
    <stop offset="100%" stop-color="#D060A0"/>
  </linearGradient>
  <linearGradient id="topMeringue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FDDCE8"/>
    <stop offset="100%" stop-color="#F4A8C0"/>
  </linearGradient>
  <linearGradient id="baseMeringue" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F8C8D8"/>
    <stop offset="100%" stop-color="#F0A0BC"/>
  </linearGradient>
  <linearGradient id="standGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#F0EEF0"/>
  </linearGradient>
  <filter id="cakeShadow">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#B040A0" flood-opacity="0.22"/>
  </filter>
  <filter id="standShadow">
    <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#cc88bb" flood-opacity="0.18"/>
  </filter>
  <filter id="castleShadow">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#C050A0" flood-opacity="0.25"/>
  </filter>
</defs>

<!-- Background -->
<rect width="400" height="500" fill="url(#bg)"/>
<!-- Soft sparkle glow blobs -->
<circle cx="70" cy="80" r="100" fill="#F8C8E0" opacity="0.22"/>
<circle cx="340" cy="300" r="90" fill="#F4B8D4" opacity="0.18"/>
<circle cx="180" cy="440" r="80" fill="#F8CCE0" opacity="0.14"/>

<!-- White distressed cake stand -->
<ellipse cx="200" cy="432" rx="155" ry="17" fill="#C8B8C8" opacity="0.22"/>
<ellipse cx="200" cy="428" rx="152" ry="15" fill="url(#standGrad)" filter="url(#standShadow)"/>
<ellipse cx="200" cy="426" rx="148" ry="13" fill="#FEFEFE"/>
<ellipse cx="200" cy="425" rx="144" ry="11" fill="#FFFFFF" stroke="#ECC8DC" stroke-width="1.2"/>
<!-- Stand distressed details -->
<line x1="122" y1="424" x2="128" y2="424" stroke="#E8C0D4" stroke-width="0.7" opacity="0.5"/>
<line x1="268" y1="424" x2="274" y2="424" stroke="#E8C0D4" stroke-width="0.7" opacity="0.5"/>
<!-- Stand pedestal -->
<rect x="190" y="428" width="20" height="24" rx="2" fill="#F8F0F4" stroke="#E8C8D8" stroke-width="1"/>
<ellipse cx="200" cy="452" rx="28" ry="5.5" fill="#F4EAF0" stroke="#E4C4D4" stroke-width="1"/>
<rect x="176" y="448" width="48" height="8" rx="3" fill="#F4EAF0" stroke="#E4C4D4" stroke-width="1"/>
<!-- Gula Cake label -->
<text x="200" y="430" font-family="Georgia,serif" font-size="8.5" fill="#CC88AA" text-anchor="middle" letter-spacing="1.5" font-style="italic">Gula Cake</text>

<!-- CAKE BODY — tall pink cylinder -->
<rect x="108" y="170" width="184" height="256" rx="8" fill="url(#cakeBody)" filter="url(#cakeShadow)"/>
<!-- Cylinder side shading -->
<rect x="108" y="170" width="18" height="256" rx="8" fill="#B83880" opacity="0.28"/>
<rect x="274" y="170" width="18" height="256" rx="8" fill="#C84890" opacity="0.18"/>
<!-- Top ellipse of cake -->
<ellipse cx="200" cy="170" rx="92" ry="11" fill="#E878A0" stroke="#D060A0" stroke-width="1.2"/>

<!-- Cake surface texture — subtle shimmer lines -->
<line x1="108" y1="220" x2="292" y2="220" stroke="#E080A8" stroke-width="0.7" opacity="0.30"/>
<line x1="108" y1="270" x2="292" y2="270" stroke="#E080A8" stroke-width="0.7" opacity="0.25"/>
<line x1="108" y1="320" x2="292" y2="320" stroke="#E080A8" stroke-width="0.7" opacity="0.25"/>
<line x1="108" y1="370" x2="292" y2="370" stroke="#E080A8" stroke-width="0.7" opacity="0.25"/>

<!-- === PRINCESS SILHOUETTES on cake sides === -->
<!-- Simplified princess figures: dress (bell triangle), head (circle), colored hair, arms -->

<!-- Princess 1 — CINDERELLA — blue, far left -->
<g transform="translate(126, 285)">
  <!-- dress -->
  <path d="M0,-60 C-6,-45 -18,0 -22,40 L22,40 C18,0 6,-45 0,-60Z" fill="#4A90D8"/>
  <path d="M-22,40 L22,40 L24,46 L-24,46Z" fill="#3A78C0"/>
  <!-- waist band -->
  <rect x="-8" y="-24" width="16" height="6" rx="3" fill="#2A60A8"/>
  <!-- bodice -->
  <path d="M-8,-24 C-6,-38 6,-38 8,-24Z" fill="#3A78C0"/>
  <!-- head -->
  <circle cx="0" cy="-48" r="9" fill="#FFDDB8"/>
  <!-- hair — golden bun -->
  <ellipse cx="0" cy="-55" rx="7" ry="5" fill="#D4A840"/>
  <circle cx="-5" cy="-52" r="3.5" fill="#C89A30"/>
  <circle cx="5" cy="-52" r="3.5" fill="#C89A30"/>
  <!-- arms -->
  <path d="M-8,-18 Q-16,-8 -14,4" stroke="#FFDDB8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M8,-18 Q16,-8 14,4" stroke="#FFDDB8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- dress sparkle -->
  <circle cx="-8" cy="10" r="1.5" fill="#FFEEBB" opacity="0.7"/>
  <circle cx="8" cy="18" r="1.5" fill="#FFEEBB" opacity="0.7"/>
  <circle cx="0" cy="30" r="2" fill="#FFEEBB" opacity="0.6"/>
</g>

<!-- Princess 2 — BELLE — yellow, left-center -->
<g transform="translate(160, 295)">
  <path d="M0,-55 C-5,-42 -16,0 -20,38 L20,38 C16,0 5,-42 0,-55Z" fill="#F0C830"/>
  <path d="M-20,38 L20,38 L22,44 L-22,44Z" fill="#D8B020"/>
  <!-- waist -->
  <rect x="-7" y="-22" width="14" height="5" rx="2.5" fill="#C09A18"/>
  <!-- bodice -->
  <path d="M-7,-22 C-5,-34 5,-34 7,-22Z" fill="#D8B020"/>
  <circle cx="0" cy="-44" r="8.5" fill="#FFDDB8"/>
  <!-- brown hair up-do -->
  <path d="M-5,-51 C-8,-54 -6,-60 0,-58 C6,-60 8,-54 5,-51Z" fill="#7A4820"/>
  <ellipse cx="0" cy="-52" rx="5" ry="4" fill="#8A5828"/>
  <!-- arms -->
  <path d="M-7,-17 Q-14,-8 -12,2" stroke="#FFDDB8" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M7,-17 Q14,-8 12,2" stroke="#FFDDB8" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <!-- dress detail -->
  <path d="M-12,10 Q0,5 12,10" stroke="#D8B020" stroke-width="1.2" fill="none" opacity="0.6"/>
  <circle cx="-6" cy="22" r="1.5" fill="#FFEEBB" opacity="0.7"/>
  <circle cx="6" cy="28" r="1.5" fill="#FFEEBB" opacity="0.7"/>
</g>

<!-- Princess 3 — ARIEL — turquoise, center -->
<g transform="translate(200, 290)">
  <!-- tail/skirt -->
  <path d="M0,-50 C-5,-35 -14,5 -12,42 L12,42 C14,5 5,-35 0,-50Z" fill="#2DC8C8"/>
  <path d="M-12,42 Q0,52 12,42 L12,46 Q0,58 -12,46Z" fill="#18A8A0"/>
  <!-- waist shell top -->
  <path d="M-7,-18 C-7,-26 7,-26 7,-18Z" fill="#18A0A0"/>
  <rect x="-7" y="-22" width="14" height="5" rx="2.5" fill="#18A0A0"/>
  <circle cx="-5" cy="-20" r="2.5" fill="#F8B8A8"/>
  <circle cx="5" cy="-20" r="2.5" fill="#F8B8A8"/>
  <circle cx="0" cy="-38" r="9" fill="#FFD8B0"/>
  <!-- red hair -->
  <path d="M-9,-44 C-14,-52 -8,-62 0,-60 C8,-62 14,-52 9,-44" fill="#D83020"/>
  <path d="M9,-44 C14,-36 12,-20 10,-15" stroke="#D83020" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M-9,-44 C-14,-36 -12,-20 -10,-15" stroke="#D83020" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- arms -->
  <path d="M-7,-16 Q-15,-6 -13,4" stroke="#FFD8B0" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M7,-16 Q15,-6 13,4" stroke="#FFD8B0" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <!-- scale dots -->
  <circle cx="-4" cy="5" r="1.5" fill="#18A0A0" opacity="0.6"/>
  <circle cx="4" cy="10" r="1.5" fill="#18A0A0" opacity="0.6"/>
  <circle cx="-2" cy="22" r="1.5" fill="#18A0A0" opacity="0.6"/>
</g>

<!-- Princess 4 — RAPUNZEL — purple, right-center -->
<g transform="translate(238, 295)">
  <path d="M0,-55 C-5,-42 -15,0 -18,38 L18,38 C15,0 5,-42 0,-55Z" fill="#9060C8"/>
  <path d="M-18,38 L18,38 L20,44 L-20,44Z" fill="#7848B0"/>
  <rect x="-7" y="-22" width="14" height="5" rx="2.5" fill="#6030A0"/>
  <path d="M-7,-22 C-5,-34 5,-34 7,-22Z" fill="#7848B0"/>
