<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FAFAF8"/><stop offset="100%" stop-color="#F0EEE8"/></linearGradient>
  <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFEF9"/><stop offset="100%" stop-color="#F0ECDF"/></linearGradient>
  <filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#a09070" flood-opacity="0.16"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="400" height="500" fill="url(#bg)"/>
<circle cx="70" cy="100" r="110" fill="#F0EDE4" opacity="0.4"/>
<circle cx="340" cy="410" r="90" fill="#EAE4D8" opacity="0.35"/>
