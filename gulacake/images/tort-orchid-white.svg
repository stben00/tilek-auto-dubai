<!-- Gold topper (script acrylic) -->
<rect x="148" y="165" width="104" height="38" rx="4" fill="none"/>
<path d="M148 190 Q160 170 200 168 Q240 170 252 190" fill="none" stroke="#C9A84C" stroke-width="1.5" filter="url(#glow)"/>
<text x="200" y="180" font-family="Georgia,serif" font-size="9.5" fill="#C9A84C" text-anchor="middle" font-style="italic" filter="url(#glow)" letter-spacing="0.3">Запрошуємо</text>
<text x="200" y="192" font-family="Georgia,serif" font-size="9.5" fill="#C9A84C" text-anchor="middle" font-style="italic" filter="url(#glow)" letter-spacing="0.3">Вчительку</text>
<text x="200" y="204" font-family="Georgia,serif" font-size="8" fill="#C9A84C" text-anchor="middle" font-style="italic" filter="url(#glow)">батьки</text>
