<path d="M166 208 Q183 198 200 208 Q217 198 234 208" stroke="#C9A84C" stroke-width="1.5" fill="none" filter="url(#glow)"/>
<!-- Label -->
<rect x="118" y="466" width="164" height="24" rx="12" fill="rgba(180,160,100,0.13)"/>
<text x="200" y="482" font-family="Georgia,serif" font-size="11" fill="#9a8050" text-anchor="middle" letter-spacing="1.2">TORT Z ORCHIDEĄ</text>
</svg>
