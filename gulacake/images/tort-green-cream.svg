<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FAFAF6"/>
    <stop offset="100%" stop-color="#F4F4EC"/>
  </linearGradient>
  <linearGradient id="cakeBody" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FEFAEC"/>
    <stop offset="50%" stop-color="#F8F4E0"/>
    <stop offset="100%" stop-color="#F0ECD8"/>
  </linearGradient>
  <linearGradient id="greenBand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#A8C882"/>
    <stop offset="100%" stop-color="#9AB87A"/>
  </linearGradient>
  <linearGradient id="creamBand" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#F8F4E4"/>
    <stop offset="100%" stop-color="#EDE8CC"/>
  </linearGradient>
  <linearGradient id="standGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#EEEEEE"/>
  </linearGradient>
  <filter id="cakeShadow">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#808060" flood-opacity="0.18"/>
  </filter>
  <filter id="standShadow">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#aaa" flood-opacity="0.20"/>
  </filter>
</defs>

