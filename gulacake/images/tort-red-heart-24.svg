<circle cx="168" cy="230" r="2" fill="#FFFFFF" opacity="0.20"/>
<circle cx="232" cy="230" r="2" fill="#FFFFFF" opacity="0.20"/>
<circle cx="174" cy="310" r="1.5" fill="#FFFFFF" opacity="0.15"/>
