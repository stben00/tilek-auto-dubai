  <path d="M-3,3 Q-8,12 -5,18" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M3,3 Q8,12 5,18" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
</g>

<!-- Bow bottom-right (near 255,322) -->
<g transform="translate(252,322)">
  <ellipse cx="-8" cy="0" rx="9" ry="5" fill="#1A1A1A" transform="rotate(-20 -8 0)"/>
  <ellipse cx="-8" cy="0" rx="6" ry="3" fill="#2A2A2A" transform="rotate(-20 -8 0)" opacity="0.6"/>
