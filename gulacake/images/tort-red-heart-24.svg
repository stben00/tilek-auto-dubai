<circle cx="270" cy="182" r="4" fill="#B01020" opacity="0.7"/>
<circle cx="283" cy="196" r="4" fill="#B01020" opacity="0.7"/>

<!-- 4 small black satin ribbon bows at corners of heart -->
<!-- Bow top-left (near 140,178) -->
<g transform="translate(138,180)">
  <!-- left loop -->
  <ellipse cx="-8" cy="0" rx="9" ry="5" fill="#1A1A1A" transform="rotate(-20 -8 0)"/>
  <ellipse cx="-8" cy="0" rx="6" ry="3" fill="#2A2A2A" transform="rotate(-20 -8 0)" opacity="0.6"/>
  <!-- right loop -->
  <ellipse cx="8" cy="0" rx="9" ry="5" fill="#1A1A1A" transform="rotate(20 8 0)"/>
  <ellipse cx="8" cy="0" rx="6" ry="3" fill="#2A2A2A" transform="rotate(20 8 0)" opacity="0.6"/>
  <!-- center knot -->
  <ellipse cx="0" cy="0" rx="4" ry="3.5" fill="#111111"/>
  <ellipse cx="0" cy="0" rx="2" ry="1.5" fill="#2A2A2A" opacity="0.5"/>
  <!-- streamers -->
  <path d="M-3,3 Q-8,14 -5,20" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M3,3 Q8,14 5,20" stroke="#1A1A1A" stroke-width="2" fill="none" stroke-linecap="round"/>
</g>

<!-- Bow top-right (near 262,178) -->
