<circle cx="238" cy="334" r="10" fill="url(#rosetteDark)" opacity="0.92"/>
<circle cx="221" cy="346" r="10" fill="url(#rosetteDark)" opacity="0.92"/>

<!-- Rosette highlight dots (white center glow) -->
<circle cx="200" cy="175" r="4" fill="#B01020" opacity="0.7"/>
<circle cx="180" cy="170" r="4" fill="#B01020" opacity="0.7"/>
<circle cx="162" cy="168" r="4" fill="#B01020" opacity="0.7"/>
<circle cx="145" cy="172" r="4" fill="#B01020" opacity="0.7"/>
<circle cx="130" cy="182" r="4" fill="#B01020" opacity="0.7"/>
<circle cx="117" cy="196" r="4" fill="#B01020" opacity="0.7"/>
<circle cx="200" cy="355" r="4" fill="#B01020" opacity="0.7"/>
<circle cx="220" cy="170" r="4" fill="#B01020" opacity="0.7"/>
<circle cx="238" cy="168" r="4" fill="#B01020" opacity="0.7"/>
