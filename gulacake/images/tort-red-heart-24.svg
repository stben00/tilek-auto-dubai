<!-- "twenty four" handwriting-style script on heart surface -->
<text x="200" y="263" font-family="Georgia,serif" font-size="18" fill="#FFFFFF" text-anchor="middle" font-style="italic" opacity="0.92" letter-spacing="1">twenty</text>
<text x="200" y="287" font-family="Georgia,serif" font-size="18" fill="#FFFFFF" text-anchor="middle" font-style="italic" opacity="0.92" letter-spacing="1">four</text>
<!-- Subtle underline flourish -->
<path d="M172,292 Q200,298 228,292" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.45" stroke-linecap="round"/>

