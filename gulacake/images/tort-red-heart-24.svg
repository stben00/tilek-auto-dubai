<!-- Upper-right arc rosettes -->
<circle cx="220" cy="170" r="10" fill="url(#rosetteDark)" opacity="0.92"/>
<circle cx="238" cy="168" r="10" fill="url(#rosetteDark)" opacity="0.92"/>
