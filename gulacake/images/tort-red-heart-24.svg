<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFF8F2"/>
    <stop offset="100%" stop-color="#FFF0E8"/>
  </linearGradient>
  <linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#C01828"/>
    <stop offset="50%" stop-color="#A01020"/>
    <stop offset="100%" stop-color="#8B0A1A"/>
  </linearGradient>
  <linearGradient id="rosetteDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#900E1E"/>
    <stop offset="100%" stop-color="#700818"/>
  </linearGradient>
  <filter id="heartShadow">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#6B0010" flood-opacity="0.30"/>
  </filter>
  <filter id="plateShadow">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#aaa" flood-opacity="0.18"/>
  </filter>
</defs>

<!-- Background -->
<rect width="400" height="500" fill="url(#bg)"/>

<!-- Soft background glow blobs -->
<circle cx="60" cy="80" r="90" fill="#FFE0CC" opacity="0.30"/>
<circle cx="350" cy="380" r="80" fill="#FFD8C0" opacity="0.20"/>

<!-- Orange tulip suggestion top-left -->
<!-- Stem -->
<line x1="52" y1="140" x2="52" y2="80" stroke="#6B8C3A" stroke-width="2.5" stroke-linecap="round"/>
<line x1="52" y1="120" x2="38" y2="106" stroke="#6B8C3A" stroke-width="2" stroke-linecap="round"/>
<line x1="52" y1="110" x2="66" y2="98" stroke="#6B8C3A" stroke-width="2" stroke-linecap="round"/>
<!-- Leaves -->
<ellipse cx="42" cy="111" rx="12" ry="5" fill="#7DA040" transform="rotate(-40 42 111)"/>
<ellipse cx="64" cy="100" rx="12" ry="5" fill="#7DA040" transform="rotate(40 64 100)"/>
<!-- Tulip petals -->
<ellipse cx="52" cy="78" rx="9" ry="14" fill="#F07820" opacity="0.90"/>
<ellipse cx="41" cy="82" rx="8" ry="12" fill="#E86010" opacity="0.85" transform="rotate(-15 41 82)"/>
<ellipse cx="63" cy="82" rx="8" ry="12" fill="#F08028" opacity="0.85" transform="rotate(15 63 82)"/>
<!-- Second tulip -->
<line x1="78" y1="145" x2="78" y2="95" stroke="#6B8C3A" stroke-width="2" stroke-linecap="round"/>
<ellipse cx="68" cy="118" rx="10" ry="4" fill="#7DA040" transform="rotate(-35 68 118)"/>
<ellipse cx="78" cy="93" rx="8" ry="12" fill="#FFA020" opacity="0.90"/>
<ellipse cx="69" cy="97" rx="7" ry="10" fill="#F08018" opacity="0.80" transform="rotate(-18 69 97)"/>
<ellipse cx="87" cy="97" rx="7" ry="10" fill="#FFAA30" opacity="0.80" transform="rotate(18 87 97)"/>
<!-- Yellow accent flowers -->
<circle cx="32" cy="72" r="5" fill="#FFD040" opacity="0.7"/>
<circle cx="90" cy="110" r="4" fill="#FFE060" opacity="0.6"/>
<circle cx="22" cy="100" r="3" fill="#FFD040" opacity="0.5"/>

<!-- White distressed round plate -->
<ellipse cx="200" cy="436" rx="155" ry="18" fill="#CCCCCC" opacity="0.30"/>
<ellipse cx="200" cy="432" rx="152" ry="16" fill="#FFFFFF" filter="url(#plateShadow)"/>
<ellipse cx="200" cy="430" rx="148" ry="14" fill="#FDFDFD"/>
<ellipse cx="200" cy="429" rx="144" ry="12" fill="#FEFEFE" stroke="#E8E4DC" stroke-width="1.5"/>
<!-- Distressed texture lines on plate -->
<line x1="118" y1="428" x2="124" y2="428" stroke="#E0DDD8" stroke-width="0.8" opacity="0.6"/>
<line x1="280" y1="428" x2="275" y2="427" stroke="#E0DDD8" stroke-width="0.8" opacity="0.6"/>
<line x1="160" y1="430" x2="164" y2="430" stroke="#E4E0DA" stroke-width="0.6" opacity="0.5"/>
<!-- Gula Cake label on plate -->
<text x="200" y="434" font-family="Georgia,serif" font-size="8.5" fill="#BBBBBB" text-anchor="middle" letter-spacing="1.5" font-style="italic">Gula Cake</text>

<!-- HEART-SHAPED CAKE — large centered heart -->
<path d="M200,370
  C200,370 112,318 104,258
  C96,198 140,165 170,168
  C185,169 200,180 200,180
  C200,180 215,169 230,168
  C260,165 304,198 296,258
  C288,318 200,370 200,370Z"
  fill="url(#heartGrad)" filter="url(#heartShadow)"/>

<!-- Heart surface sheen -->
<path d="M200,370
  C200,370 112,318 104,258
  C96,198 140,165 170,168
  C185,169 200,180 200,180
  C200,180 215,169 230,168
  C260,165 304,198 296,258
  C288,318 200,370 200,370Z"
  fill="none" stroke="#D02030" stroke-width="1.5" opacity="0.4"/>

<!-- Heart highlight / sheen top-left -->
<path d="M158,188 C148,195 138,215 140,235" stroke="#E83848" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.35"/>
<ellipse cx="162" cy="205" rx="18" ry="26" fill="#D82838" opacity="0.12" transform="rotate(-15 162 205)"/>

