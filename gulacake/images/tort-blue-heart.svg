  <!-- ======================== BIRTHDAY TEXT ======================== -->
  <text x="200" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="13"
        fill="#7BA8C8" text-anchor="middle" font-style="italic" font-weight="bold">Happy Birthday</text>
  <text x="200" y="248" font-family="Georgia, 'Times New Roman', serif" font-size="14"
        fill="#5888B0" text-anchor="middle" font-style="italic" font-weight="bold">Evgeniya!</text>
  <!-- Small decorative line under text -->
  <path d="M158,256 Q200,262 242,256" fill="none" stroke="#A8C8E0" stroke-width="1.5"/>
  <!-- Small hearts decoration -->
  <text x="170" y="272" font-family="Arial" font-size="10" fill="#A8C8E0" text-anchor="middle">♥</text>
  <text x="200" y="275" font-family="Arial" font-size="12" fill="#7BA8C8" text-anchor="middle">♥</text>
  <text x="230" y="272" font-family="Arial" font-size="10" fill="#A8C8E0" text-anchor="middle">♥</text>

  <!-- ======================== SATIN RIBBON BOWS ======================== -->
  <!-- BOW 1: Top-left (near top-left bump of heart ~155,175) -->
  <g transform="translate(148, 172) rotate(-20)">
    <!-- Left loop -->
    <path d="M0,0 C-12,-8 -18,-18 -12,-22 C-6,-26 0,-16 0,0 Z" fill="url(#ribbonGrad)" stroke="#5888B0" stroke-width="0.5"/>
    <!-- Right loop -->
    <path d="M0,0 C12,-8 18,-18 12,-22 C6,-26 0,-16 0,0 Z" fill="url(#ribbonGrad2)" stroke="#5888B0" stroke-width="0.5"/>
    <!-- Left streamer -->
    <path d="M0,0 C-8,6 -10,14 -14,20" fill="none" stroke="#7BA8C8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right streamer -->
    <path d="M0,0 C6,8 6,14 8,22" fill="none" stroke="#8AB0CC" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Center knot -->
    <ellipse cx="0" cy="-2" rx="4" ry="3" fill="#A0C4DC" stroke="#6898B8" stroke-width="0.5"/>
  </g>

  <!-- BOW 2: Top-right (near top-right bump ~252,175) -->
  <g transform="translate(252, 172) rotate(20)">
    <path d="M0,0 C-12,-8 -18,-18 -12,-22 C-6,-26 0,-16 0,0 Z" fill="url(#ribbonGrad)" stroke="#5888B0" stroke-width="0.5"/>
    <path d="M0,0 C12,-8 18,-18 12,-22 C6,-26 0,-16 0,0 Z" fill="url(#ribbonGrad2)" stroke="#5888B0" stroke-width="0.5"/>
    <path d="M0,0 C-8,6 -10,14 -14,20" fill="none" stroke="#7BA8C8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,0 C6,8 6,14 8,22" fill="none" stroke="#8AB0CC" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="0" cy="-2" rx="4" ry="3" fill="#A0C4DC" stroke="#6898B8" stroke-width="0.5"/>
  </g>

  <!-- BOW 3: Bottom-left (~148, 292) -->
  <g transform="translate(148, 292) rotate(-35)">
    <path d="M0,0 C-10,-6 -14,-14 -9,-17 C-4,-20 0,-12 0,0 Z" fill="url(#ribbonGrad)" stroke="#5888B0" stroke-width="0.5"/>
    <path d="M0,0 C10,-6 14,-14 9,-17 C4,-20 0,-12 0,0 Z" fill="url(#ribbonGrad2)" stroke="#5888B0" stroke-width="0.5"/>
    <path d="M0,0 C-6,5 -8,10 -10,16" fill="none" stroke="#7BA8C8" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 C4,6 5,10 6,16" fill="none" stroke="#8AB0CC" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="-1" rx="3" ry="2.5" fill="#A0C4DC" stroke="#6898B8" stroke-width="0.5"/>
  </g>

  <!-- BOW 4: Bottom-right (~252, 292) -->
  <g transform="translate(252, 292) rotate(35)">
    <path d="M0,0 C-10,-6 -14,-14 -9,-17 C-4,-20 0,-12 0,0 Z" fill="url(#ribbonGrad)" stroke="#5888B0" stroke-width="0.5"/>
    <path d="M0,0 C10,-6 14,-14 9,-17 C4,-20 0,-12 0,0 Z" fill="url(#ribbonGrad2)" stroke="#5888B0" stroke-width="0.5"/>
    <path d="M0,0 C-6,5 -8,10 -10,16" fill="none" stroke="#7BA8C8" stroke-width="2" stroke-linecap="round"/>
    <path d="M0,0 C4,6 5,10 6,16" fill="none" stroke="#8AB0CC" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="0" cy="-1" rx="3" ry="2.5" fill="#A0C4DC" stroke="#6898B8" stroke-width="0.5"/>
  </g>

  <!-- ======================== BOTTOM LABEL ======================== -->
  <rect x="80" y="470" width="240" height="25" rx="4" fill="#D4E8F5" stroke="#7BA8C8" stroke-width="1.2"/>
  <!-- Label inner border -->
  <rect x="84" y="473" width="232" height="19" rx="3" fill="none" stroke="#A8C8E0" stroke-width="0.6"/>
  <text x="200" y="487" font-family="Georgia, 'Times New Roman', serif" font-size="10"
        fill="#4A7898" text-anchor="middle" font-weight="bold" letter-spacing="1.5">TORT W KSZTAŁCIE SERCA</text>

  <!-- Small decorative stars at bottom corners -->
  <text x="92" y="487" font-size="8" fill="#7BA8C8" text-anchor="middle">✦</text>
  <text x="308" y="487" font-size="8" fill="#7BA8C8" text-anchor="middle">✦</text>
</svg>
