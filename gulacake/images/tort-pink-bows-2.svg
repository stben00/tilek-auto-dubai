<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Background -->
    <linearGradient id="bg-pink" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FDF5F6"/>
      <stop offset="100%" stop-color="#FAF0F2"/>
    </linearGradient>
    <!-- Cake body -->
    <linearGradient id="cake-cream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EDE6DC"/>
      <stop offset="15%" stop-color="#FEFCF8"/>
      <stop offset="85%" stop-color="#FEFCF8"/>
      <stop offset="100%" stop-color="#EDE6DC"/>
    </linearGradient>
    <!-- Cake top -->
    <radialGradient id="cake-top-cream" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEFCF8"/>
      <stop offset="100%" stop-color="#EDE6DC"/>
    </radialGradient>
    <!-- Stand gradient -->
    <linearGradient id="stand-pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D8CCCA"/>
      <stop offset="30%" stop-color="#F8F0EE"/>
      <stop offset="70%" stop-color="#F8F0EE"/>
      <stop offset="100%" stop-color="#D8CCCA"/>
    </linearGradient>
    <!-- Number 2 gradient -->
    <linearGradient id="num-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEFCF8"/>
      <stop offset="100%" stop-color="#F0E8E0"/>
    </linearGradient>
    <!-- Candle gradient -->
    <linearGradient id="candle-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E87098"/>
      <stop offset="50%" stop-color="#F090B0"/>
      <stop offset="100%" stop-color="#E07090"/>
    </linearGradient>
    <filter id="shadow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#00000020"/>
    </filter>
    <filter id="bow-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#00000025"/>
    </filter>
    <filter id="glow-pink" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#F090B0" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg-pink)"/>

  <!-- Pink tulip shapes upper-right — loosely visible -->
  <g transform="translate(310, 48)" opacity="0.25">
    <!-- Stem 1 -->
    <line x1="0" y1="90" x2="0" y2="30" stroke="#D06080" stroke-width="2" stroke-linecap="round"/>
    <!-- Leaf 1 -->
    <path d="M0,65 Q-16,50 -12,38 Q-4,52 0,58 Z" fill="#E06080"/>
    <path d="M0,60 Q16,45 12,33 Q4,48 0,54 Z" fill="#CC5070"/>
    <!-- Petal group 1 -->
    <path d="M0,30 Q-10,12 -6,-6 Q0,8 0,22 Z" fill="#F06080"/>
    <path d="M0,30 Q10,12 6,-6 Q0,8 0,22 Z" fill="#E05870"/>
    <ellipse cx="0" cy="8" rx="6" ry="14" fill="#F06888" opacity="0.9"/>

    <!-- Stem 2 -->
    <line x1="22" y1="100" x2="22" y2="42" stroke="#D06080" stroke-width="2" stroke-linecap="round"/>
    <!-- Leaf 2 -->
    <path d="M22,75 Q8,60 12,48 Q18,62 22,68 Z" fill="#E06080"/>
    <!-- Petals 2 -->
    <path d="M22,42 Q12,24 16,6 Q22,20 22,36 Z" fill="#F06888"/>
    <path d="M22,42 Q32,24 28,6 Q22,20 22,36 Z" fill="#E05870"/>
    <ellipse cx="22" cy="18" rx="6" ry="14" fill="#F57090" opacity="0.85"/>
  </g>

  <!-- Subtle background scattered dots (very faint) -->
  <circle cx="50" cy="100" r="3" fill="#F090B0" opacity="0.12"/>
  <circle cx="360" cy="420" r="4" fill="#F090B0" opacity="0.1"/>
  <circle cx="80" cy="300" r="2.5" fill="#F090B0" opacity="0.1"/>
  <circle cx="350" cy="180" r="3" fill="#F090B0" opacity="0.08"/>

  <!-- === CAKE STAND — tall pedestal style === -->
  <!-- Base shadow -->
  <ellipse cx="200" cy="425" rx="70" ry="6" fill="#00000012"/>
  <!-- Wide base plate -->
  <rect x="145" y="412" width="110" height="14" rx="7" fill="url(#stand-pink)" filter="url(#shadow-soft)"/>
  <!-- Base highlight -->
  <rect x="152" y="413" width="96" height="5" rx="2.5" fill="#FFFFFF" opacity="0.7"/>
  <!-- Distressed marks on base -->
  <line x1="162" y1="418" x2="175" y2="418" stroke="#C4B4B0" stroke-width="0.8" opacity="0.4"/>
  <line x1="222" y1="420" x2="238" y2="420" stroke="#C4B4B0" stroke-width="0.8" opacity="0.4"/>
  <!-- Pedestal column — slightly wider in middle -->
  <path d="M188,408 Q184,390 184,365 Q184,340 188,320 L212,320 Q216,340 216,365 Q216,390 212,408 Z" fill="url(#stand-pink)"/>
  <!-- Column center highlight -->
  <path d="M193,408 Q190,390 190,365 Q190,340 193,320 L197,320 Q194,340 194,365 Q194,390 197,408 Z" fill="#FFFFFF" opacity="0.45"/>
  <!-- Column decorative rings -->
  <ellipse cx="200" cy="365" rx="14" ry="3" fill="url(#stand-pink)" stroke="#C4B4B0" stroke-width="0.5"/>
  <ellipse cx="200" cy="380" rx="12" ry="2.5" fill="url(#stand-pink)" stroke="#C4B4B0" stroke-width="0.4"/>
  <!-- Platform (top of pedestal) -->
  <rect x="155" y="314" width="90" height="10" rx="5" fill="url(#stand-pink)" filter="url(#shadow-soft)"/>
  <rect x="160" y="315" width="80" height="4" rx="2" fill="#FFFFFF" opacity="0.6"/>
  <!-- "Gula Cake" label -->
  <text x="200" y="440" font-family="Georgia, serif" font-size="7" fill="#B8989690" text-anchor="middle" letter-spacing="1">Gula Cake</text>

  <!-- === CAKE BODY — short and wide === -->
  <!-- Cake shadow on pedestal -->
  <ellipse cx="200" cy="318" rx="90" ry="7" fill="#00000012"/>
  <!-- Cake main body -->
  <rect x="112" y="228" width="176" height="92" rx="5" fill="url(#cake-cream)" filter="url(#shadow-soft)"/>
  <!-- Subtle side sheen -->
  <rect x="116" y="232" width="10" height="84" rx="3" fill="white" opacity="0.15"/>
  <rect x="278" y="232" width="7" height="84" rx="2" fill="white" opacity="0.1"/>
  <!-- Bottom edge of cake (soft shadow) -->
  <rect x="112" y="312" width="176" height="6" rx="2" fill="#D8D0C4" opacity="0.3"/>
  <!-- Cake top ellipse -->
  <ellipse cx="200" cy="228" rx="88" ry="10" fill="url(#cake-top-cream)" stroke="#DDD6CC" stroke-width="1.2"/>
  <!-- Top highlight shine -->
  <ellipse cx="185" cy="225" rx="42" ry="5" fill="white" opacity="0.5"/>

  <!-- === PINK FONDANT BOW DECORATIONS === -->
  <!-- Bow helper paths: 2 loops (left+right kidney shapes) + center knot + 2 streamers -->

  <!-- BOW 1 — left side, upper -->
  <g transform="translate(136, 248)" filter="url(#bow-shadow)">
    <!-- Left loop -->
    <path d="M0,0 C-4,-12 -18,-14 -18,-6 C-18,2 -8,6 0,0 Z" fill="#F090B0" stroke="#D06090" stroke-width="0.8"/>
    <path d="M0,0 C-4,-12 -18,-14 -18,-6 C-18,2 -8,6 0,0 Z" fill="#F8B0C8" opacity="0.4"/>
    <!-- Right loop -->
    <path d="M0,0 C4,-12 18,-14 18,-6 C18,2 8,6 0,0 Z" fill="#F090B0" stroke="#D06090" stroke-width="0.8"/>
    <path d="M0,0 C4,-12 18,-14 18,-6 C18,2 8,6 0,0 Z" fill="#F8B0C8" opacity="0.3"/>
    <!-- Center knot -->
    <ellipse cx="0" cy="0" rx="5" ry="4" fill="#E878A0" stroke="#D06090" stroke-width="0.8"/>
    <!-- Streamers -->
    <path d="M-2,2 Q-6,10 -10,14" stroke="#F090B0" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M2,2 Q6,10 10,14" stroke="#F090B0" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Streamer ends -->
    <path d="M-10,14 Q-14,16 -10,18 Q-8,14 -10,14 Z" fill="#F090B0"/>
    <path d="M10,14 Q14,16 10,18 Q8,14 10,14 Z" fill="#F090B0"/>
  </g>

  <!-- BOW 2 — left side, lower -->
  <g transform="translate(140, 295)" filter="url(#bow-shadow)">
    <path d="M0,0 C-3,-10 -16,-12 -15,-5 C-14,2 -6,5 0,0 Z" fill="#F090B0" stroke="#D06090" stroke-width="0.8"/>
    <path d="M0,0 C3,-10 16,-12 15,-5 C14,2 6,5 0,0 Z" fill="#F090B0" stroke="#D06090" stroke-width="0.8"/>
    <!-- Highlight -->
    <path d="M0,0 C-3,-10 -16,-12 -15,-5 C-14,2 -6,5 0,0 Z" fill="#F8B0C8" opacity="0.35"/>
    <ellipse cx="0" cy="0" rx="4.5" ry="3.5" fill="#E878A0" stroke="#D06090" stroke-width="0.8"/>
    <path d="M-1.5,2 Q-5,9 -8,12" stroke="#F090B0" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M1.5,2 Q5,9 8,12" stroke="#F090B0" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- BOW 3 — right side, upper -->
  <g transform="translate(264, 248)" filter="url(#bow-shadow)">
    <path d="M0,0 C-4,-12 -18,-14 -18,-6 C-18,2 -8,6 0,0 Z" fill="#F090B0" stroke="#D06090" stroke-width="0.8"/>
    <path d="M0,0 C4,-12 18,-14 18,-6 C18,2 8,6 0,0 Z" fill="#F090B0" stroke="#D06090" stroke-width="0.8"/>
    <path d="M0,0 C-4,-12 -18,-14 -18,-6 C-18,2 -8,6 0,0 Z" fill="#F8B0C8" opacity="0.35"/>
    <path d="M0,0 C4,-12 18,-14 18,-6 C18,2 8,6 0,0 Z" fill="#F8B0C8" opacity="0.25"/>
    <ellipse cx="0" cy="0" rx="5" ry="4" fill="#E878A0" stroke="#D06090" stroke-width="0.8"/>
    <path d="M-2,2 Q-6,10 -10,14" stroke="#F090B0" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M2,2 Q6,10 10,14" stroke="#F090B0" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M-10,14 Q-14,16 -10,18 Q-8,14 -10,14 Z" fill="#F090B0"/>
    <path d="M10,14 Q14,16 10,18 Q8,14 10,14 Z" fill="#F090B0"/>
  </g>

  <!-- BOW 4 — right side, lower -->
  <g transform="translate(262, 296)" filter="url(#bow-shadow)">
    <path d="M0,0 C-3,-10 -16,-12 -15,-5 C-14,2 -6,5 0,0 Z" fill="#F090B0" stroke="#D06090" stroke-width="0.8"/>
    <path d="M0,0 C3,-10 16,-12 15,-5 C14,2 6,5 0,0 Z" fill="#F090B0" stroke="#D06090" stroke-width="0.8"/>
    <path d="M0,0 C-3,-10 -16,-12 -15,-5 C-14,2 -6,5 0,0 Z" fill="#F8B0C8" opacity="0.35"/>
    <ellipse cx="0" cy="0" rx="4.5" ry="3.5" fill="#E878A0" stroke="#D06090" stroke-width="0.8"/>
    <path d="M-1.5,2 Q-5,9 -8,12" stroke="#F090B0" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M1.5,2 Q5,9 8,12" stroke="#F090B0" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- BOW 5 — front left -->
  <g transform="translate(160, 270)" filter="url(#bow-shadow)">
    <path d="M0,0 C-3,-9 -14,-11 -14,-4 C-14,3 -5,4 0,0 Z" fill="#F090B0" stroke="#D06090" stroke-width="0.7"/>
    <path d="M0,0 C3,-9 14,-11 14,-4 C14,3 5,4 0,0 Z" fill="#F090B0" stroke="#D06090" stroke-width="0.7"/>
    <ellipse cx="0" cy="0" rx="4" ry="3" fill="#E878A0" stroke="#D06090" stroke-width="0.7"/>
    <path d="M-1,1.5 Q-4,7 -6,10" stroke="#F090B0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M1,1.5 Q4,7 6,10" stroke="#F090B0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- BOW 6 — front right -->
  <g transform="translate(240, 272)" filter="url(#bow-shadow)">
    <path d="M0,0 C-3,-9 -14,-11 -14,-4 C-14,3 -5,4 0,0 Z" fill="#F090B0" stroke="#D06090" stroke-width="0.7"/>
    <path d="M0,0 C3,-9 14,-11 14,-4 C14,3 5,4 0,0 Z" fill="#F090B0" stroke="#D06090" stroke-width="0.7"/>
    <ellipse cx="0" cy="0" rx="4" ry="3" fill="#E878A0" stroke="#D06090" stroke-width="0.7"/>
    <path d="M-1,1.5 Q-4,7 -6,10" stroke="#F090B0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M1,1.5 Q4,7 6,10" stroke="#F090B0" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- BOW 7 — front center low -->
  <g transform="translate(200, 305)" filter="url(#bow-shadow)">
    <path d="M0,0 C-4,-11 -17,-13 -16,-5 C-15,3 -6,5 0,0 Z" fill="#F090B0" stroke="#D06090" stroke-width="0.8"/>
    <path d="M0,0 C4,-11 17,-13 16,-5 C15,3 6,5 0,0 Z" fill="#F090B0" stroke="#D06090" stroke-width="0.8"/>
    <path d="M0,0 C-4,-11 -17,-13 -16,-5 C-15,3 -6,5 0,0 Z" fill="#F8B0C8" opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="4.5" ry="3.5" fill="#E878A0" stroke="#D06090" stroke-width="0.8"/>
    <path d="M-1.5,2 Q-5,10 -8,14" stroke="#F090B0" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M1.5,2 Q5,10 8,14" stroke="#F090B0" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M-8,14 Q-11,16 -8,18 Q-7,14 -8,14 Z" fill="#F090B0"/>
    <path d="M8,14 Q11,16 8,18 Q7,14 8,14 Z" fill="#F090B0"/>
  </g>

  <!-- === NUMBER "2" ON TOP OF CAKE === -->
  <!-- White fondant number 2 -->
  <text x="188" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="url(#num-grad)" text-anchor="middle" stroke="#E0D8CC" stroke-width="2" paint-order="stroke" filter="url(#shadow-soft)">2</text>
  <!-- Small pink bow on the "2" -->
  <g transform="translate(200, 196)" filter="url(#bow-shadow)">
    <!-- Left loop -->
    <path d="M0,0 C-2,-7 -12,-9 -11,-4 C-10,1 -4,3 0,0 Z" fill="#F090B0" stroke="#D06090" stroke-width="0.6"/>
    <!-- Right loop -->
    <path d="M0,0 C2,-7 12,-9 11,-4 C10,1 4,3 0,0 Z" fill="#F090B0" stroke="#D06090" stroke-width="0.6"/>
    <!-- Highlight -->
    <path d="M0,0 C-2,-7 -12,-9 -11,-4 C-10,1 -4,3 0,0 Z" fill="#F8C0D0" opacity="0.4"/>
    <!-- Center knot -->
    <ellipse cx="0" cy="0" rx="3.5" ry="2.5" fill="#E878A0" stroke="#D06090" stroke-width="0.6"/>
    <!-- Streamers -->
    <path d="M-1,1 Q-3,5 -5,7" stroke="#F090B0" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M1,1 Q3,5 5,7" stroke="#F090B0" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- === PINK CANDLE (top right of cake) === -->
  <!-- Candle body -->
  <rect x="248" y="196" width="12" height="32" rx="4" fill="url(#candle-grad)" filter="url(#shadow-soft)"/>
  <!-- Candle stripe -->
  <rect x="248" y="204" width="12" height="3" rx="1" fill="white" opacity="0.5"/>
  <rect x="248" y="214" width="12" height="3" rx="1" fill="white" opacity="0.4"/>
  <rect x="248" y="224" width="12" height="3" rx="1" fill="white" opacity="0.35"/>
  <!-- Candle top rim -->
  <ellipse cx="254" cy="196" rx="6" ry="2.5" fill="#F8B0C8"/>
  <!-- Wick -->
  <line x1="254" y1="194" x2="254" y2="187" stroke="#4A2A2A" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Flame outer -->
  <path d="M254,187 Q248,178 250,170 Q254,165 258,170 Q260,178 254,187 Z" fill="#FFD060" opacity="0.9"/>
  <!-- Flame inner -->
  <path d="M254,185 Q250,178 252,172 Q254,168 256,172 Q258,178 254,185 Z" fill="#FF8830" opacity="0.85"/>
  <!-- Flame core -->
  <ellipse cx="254" cy="176" rx="2.5" ry="5" fill="#FFEE99" opacity="0.9"/>
  <!-- Flame glow -->
  <ellipse cx="254" cy="176" rx="8" ry="10" fill="#FFD060" opacity="0.15"/>

  <!-- === BOTTOM LABEL === -->
  <text x="200" y="478" font-family="Georgia, serif" font-size="10" fill="#E07090" text-anchor="middle" letter-spacing="2" font-weight="bold">TORT URODZINOWY</text>
  <line x1="138" y1="482" x2="262" y2="482" stroke="#E07090" stroke-width="0.8" opacity="0.5"/>
  <line x1="155" y1="485" x2="245" y2="485" stroke="#E07090" stroke-width="0.5" opacity="0.35"/>

  <!-- Tiny floating hearts decoration -->
  <text x="105" y="250" font-size="10" fill="#F090B0" opacity="0.3">♥</text>
  <text x="290" y="310" font-size="8" fill="#F090B0" opacity="0.25">♥</text>
  <text x="310" y="240" font-size="7" fill="#F090B0" opacity="0.2">♥</text>
  <text x="88" y="310" font-size="6" fill="#F090B0" opacity="0.2">♥</text>
</svg>
