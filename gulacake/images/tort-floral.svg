<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F0F4FF"/><stop offset="100%" stop-color="#E0E8F8"/></linearGradient>
  <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F5F0F8"/></linearGradient>
  <linearGradient id="hand" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F5CEB0"/><stop offset="100%" stop-color="#E8B898"/></linearGradient>
  <filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1a3a6e" flood-opacity="0.12"/></filter>
</defs>
<rect width="400" height="500" fill="url(#bg)"/>
<circle cx="80" cy="100" r="120" fill="#D8E4FF" opacity="0.25"/>
<circle cx="330" cy="400" r="100" fill="#C8D8F8" opacity="0.2"/>
<!-- Hand holding cake -->
<ellipse cx="200" cy="420" rx="55" ry="20" fill="url(#hand)"/>
<rect x="162" y="380" width="76" height="52" rx="12" fill="url(#hand)"/>
<!-- Fingers suggestion -->
<rect x="162" y="382" width="14" height="38" rx="7" fill="#E8B898"/>
