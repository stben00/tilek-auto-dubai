<!-- "JAK ZAMÓWIĆ TORT?" style text faint in background -->
<text x="200" y="80" font-family="Arial Black,sans-serif" font-size="22" fill="#1a3580" opacity="0.1" text-anchor="middle" font-weight="900">JAK ZAMÓWIĆ TORT?</text>
