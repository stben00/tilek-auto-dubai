<line x1="162" y1="406" x2="238" y2="406" stroke="#90C890" stroke-width="2" stroke-linecap="round"/>
<!-- Cake body on hand -->
<rect x="140" y="240" width="120" height="150" rx="10" fill="url(#cake)" stroke="#E0E8F8" stroke-width="1.5" filter="url(#sh)"/>
