  <circle cx="0" cy="-10" r="7" fill="white" stroke="#1a3580" stroke-width="1"/>
  <circle cx="0" cy="10" r="7" fill="white" stroke="#1a3580" stroke-width="1"/>
  <circle cx="-10" cy="0" r="7" fill="white" stroke="#1a3580" stroke-width="1"/>
  <circle cx="10" cy="0" r="7" fill="white" stroke="#1a3580" stroke-width="1"/>
  <circle cx="0" cy="0" r="5" fill="#5068C0"/>
</g>
<g transform="translate(225 222)">
  <circle cx="0" cy="0" r="7" fill="white" stroke="#1a3580" stroke-width="1.2"/>
  <circle cx="0" cy="-9" r="6" fill="white" stroke="#1a3580" stroke-width="1"/>
  <circle cx="0" cy="9" r="6" fill="white" stroke="#1a3580" stroke-width="1"/>
  <circle cx="-9" cy="0" r="6" fill="white" stroke="#1a3580" stroke-width="1"/>
  <circle cx="9" cy="0" r="6" fill="white" stroke="#1a3580" stroke-width="1"/>
  <circle cx="0" cy="0" r="4" fill="#5068C0"/>
