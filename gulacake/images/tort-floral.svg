<ellipse cx="200" cy="240" rx="62" ry="9" fill="white" stroke="#E0E8F8" stroke-width="1.2"/>
<!-- Blue floral decorations on cake side -->
<!-- Vine stems -->
<path d="M148 360 Q155 340 150 310 Q157 295 155 270" stroke="#1a3580" stroke-width="1.5" fill="none"/>
<path d="M252 355 Q245 335 250 305 Q243 290 245 268" stroke="#1a3580" stroke-width="1.5" fill="none"/>
<path d="M175 380 Q185 365 178 340 Q183 320 180 295" stroke="#1a3580" stroke-width="1.5" fill="none"/>
<path d="M225 378 Q215 362 222 338 Q217 318 220 293" stroke="#1a3580" stroke-width="1.5" fill="none"/>
<!-- Leaves on vines -->
<ellipse cx="153" cy="325" rx="7" ry="5" fill="#1a3580" transform="rotate(-30 153 325)"/>
<ellipse cx="248" cy="320" rx="7" ry="5" fill="#1a3580" transform="rotate(30 248 320)"/>
<ellipse cx="177" cy="345" rx="6" ry="4" fill="#1a3580" transform="rotate(-20 177 345)"/>
<ellipse cx="223" cy="343" rx="6" ry="4" fill="#1a3580" transform="rotate(20 223 343)"/>
<ellipse cx="152" cy="290" rx="6" ry="4" fill="#1a3580" transform="rotate(-40 152 290)"/>
<ellipse cx="248" cy="285" rx="6" ry="4" fill="#1a3580" transform="rotate(40 248 285)"/>
<!-- Flowers on cake sides -->
<!-- Left flower -->
<circle cx="155" cy="305" r="5" fill="white" stroke="#1a3580" stroke-width="1"/>
<circle cx="155" cy="296" r="4" fill="white" stroke="#1a3580" stroke-width="1"/>
<circle cx="155" cy="314" r="4" fill="white" stroke="#1a3580" stroke-width="1"/>
<circle cx="147" cy="305" r="4" fill="white" stroke="#1a3580" stroke-width="1"/>
<circle cx="163" cy="305" r="4" fill="white" stroke="#1a3580" stroke-width="1"/>
<circle cx="155" cy="305" r="3" fill="#5068C0"/>
<!-- Right flower -->
<circle cx="245" cy="300" r="5" fill="white" stroke="#1a3580" stroke-width="1"/>
<circle cx="245" cy="291" r="4" fill="white" stroke="#1a3580" stroke-width="1"/>
<circle cx="245" cy="309" r="4" fill="white" stroke="#1a3580" stroke-width="1"/>
<circle cx="237" cy="300" r="4" fill="white" stroke="#1a3580" stroke-width="1"/>
<circle cx="253" cy="300" r="4" fill="white" stroke="#1a3580" stroke-width="1"/>
<circle cx="245" cy="300" r="3" fill="#5068C0"/>
<!-- Top flowers (3 flowers on top) -->
<g transform="translate(175 220)">
  <circle cx="0" cy="0" r="7" fill="white" stroke="#1a3580" stroke-width="1.2"/>
  <circle cx="0" cy="-9" r="6" fill="white" stroke="#1a3580" stroke-width="1"/>
