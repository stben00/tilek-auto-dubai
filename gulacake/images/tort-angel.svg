<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FDF0F5"/><stop offset="100%" stop-color="#EDD5DC"/></linearGradient>
  <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFCFD"/><stop offset="100%" stop-color="#F5E8EE"/></linearGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F0DDE4"/><stop offset="100%" stop-color="#D9BFC8"/></linearGradient>
  <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#C97D94" flood-opacity="0.18"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- Background -->
<rect width="400" height="500" fill="url(#bg)"/>
<circle cx="60" cy="80" r="140" fill="#F9D8E3" opacity="0.22"/>
<circle cx="350" cy="430" r="110" fill="#F9D8E3" opacity="0.2"/>
<!-- Plate -->
<ellipse cx="200" cy="436" rx="125" ry="14" fill="url(#plate)"/>
<ellipse cx="200" cy="433" rx="122" ry="12" fill="#F5E0E8"/>
<!-- Bottom tier -->
<rect x="72" y="318" width="256" height="116" rx="10" fill="url(#cake)" stroke="#E8D0D8" stroke-width="1.5" filter="url(#sh)"/>
<ellipse cx="200" cy="318" rx="128" ry="10" fill="white" stroke="#EDD0D8" stroke-width="1"/>
<!-- Frosting drips bottom -->
<path d="M88 318 Q97 332 108 318 Q119 332 130 318 Q141 332 152 318 Q163 332 174 318 Q185 332 196 318 Q207 332 218 318 Q229 332 240 318 Q251 332 262 318 Q273 332 283 318 Q294 332 304 318" stroke="#F9D8E3" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<!-- Bottom tier trim -->
<line x1="72" y1="372" x2="328" y2="372" stroke="#E8D0D8" stroke-width="0.8" stroke-dasharray="5 7"/>
<!-- Stars on bottom tier -->
<g fill="#C9A84C" filter="url(#glow)">
  <text x="128" y="358" font-size="15" opacity="0.85">✦</text>
  <text x="195" y="352" font-size="20">✦</text>
  <text x="258" y="358" font-size="15" opacity="0.85">✦</text>
  <text x="165" y="408" font-size="11" opacity="0.6">✦</text>
  <text x="228" y="408" font-size="11" opacity="0.6">✦</text>
</g>
<!-- Top tier -->
<rect x="112" y="218" width="176" height="103" rx="8" fill="url(#cake)" stroke="#E8D0D8" stroke-width="1.5"/>
<ellipse cx="200" cy="218" rx="88" ry="9" fill="white" stroke="#EDD0D8" stroke-width="1"/>
<!-- Frosting drips top tier -->
<path d="M122 218 Q131 230 140 218 Q149 230 158 218 Q167 230 176 218 Q185 230 194 218 Q203 230 212 218 Q221 230 230 218 Q239 230 248 218 Q257 230 266 218 Q275 230 280 218" stroke="#F9D8E3" stroke-width="2" fill="none" stroke-linecap="round"/>
<!-- Cross decoration on top tier -->
<line x1="200" y1="244" x2="200" y2="286" stroke="#C97D94" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
<line x1="180" y1="260" x2="220" y2="260" stroke="#C97D94" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
<!-- Angel wings -->
<path d="M152 193 Q125 170 108 145 Q122 152 138 165 Q125 140 132 120 Q146 145 150 168 Q142 144 158 128 Q158 152 154 180 Z" fill="#F9D8E3" stroke="#E8C0CC" stroke-width="1.2"/>
<path d="M248 193 Q275 170 292 145 Q278 152 262 165 Q275 140 268 120 Q254 145 250 168 Q258 144 242 128 Q242 152 246 180 Z" fill="#F9D8E3" stroke="#E8C0CC" stroke-width="1.2"/>
<!-- Angel head -->
<circle cx="200" cy="194" r="20" fill="#FFF0F5" stroke="#ECCCD4" stroke-width="1.5"/>
<circle cx="193" cy="191" r="2.5" fill="#C97D94"/>
<circle cx="207" cy="191" r="2.5" fill="#C97D94"/>
<path d="M192 200 Q200 207 208 200" stroke="#C97D94" stroke-width="1.8" fill="none" stroke-linecap="round"/>
<!-- Halo -->
<ellipse cx="200" cy="173" rx="16" ry="5" fill="none" stroke="#C9A84C" stroke-width="2.5"/>
<!-- Floating stars -->
<text x="88" y="195" font-size="11" fill="#C9A84C" opacity="0.55">✦</text>
<text x="302" y="205" font-size="11" fill="#C9A84C" opacity="0.55">✦</text>
<text x="156" y="140" font-size="9" fill="#C97D94" opacity="0.45">✦</text>
<text x="232" y="142" font-size="9" fill="#C97D94" opacity="0.45">✦</text>
<!-- Label -->
<rect x="140" y="462" width="120" height="24" rx="12" fill="rgba(201,125,148,0.15)"/>
<text x="200" y="478" font-family="Georgia,serif" font-size="11" fill="#C97D94" text-anchor="middle" letter-spacing="1.5">GULA CAKE</text>
</svg>
