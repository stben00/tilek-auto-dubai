<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0EDE7"/>
    </radialGradient>

    <!-- Dome gradient - soft white satin -->
    <radialGradient id="domeGrad" cx="38%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F7F5F2"/>
      <stop offset="100%" stop-color="#E8E4DF"/>
    </radialGradient>

    <!-- Petal gradient -->
    <radialGradient id="petalGrad" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DDDAD5"/>
    </radialGradient>

    <!-- Stand gradient -->
    <radialGradient id="standGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E8E4DF"/>
      <stop offset="100%" stop-color="#C8C4BE"/>
    </radialGradient>

    <!-- Gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C96A"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#A8872C"/>
    </linearGradient>

    <!-- Dove body gradient -->
    <radialGradient id="doveGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5E2DE"/>
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#C0B8A8" flood-opacity="0.3"/>
    </filter>

    <!-- Subtle shadow for dome -->
    <filter id="domeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="10" flood-color="#B0A898" flood-opacity="0.25"/>
    </filter>

    <!-- Glow filter for letters -->
    <filter id="goldGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#C9A84C" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)"/>

  <!-- Subtle background decorative dots -->
  <circle cx="30" cy="50" r="3" fill="#E8E4DF" opacity="0.5"/>
  <circle cx="370" cy="80" r="2" fill="#E8E4DF" opacity="0.5"/>
  <circle cx="50" cy="150" r="2" fill="#E8E4DF" opacity="0.4"/>
  <circle cx="360" cy="200" r="3" fill="#E8E4DF" opacity="0.4"/>
  <circle cx="20" cy="300" r="2" fill="#E8E4DF" opacity="0.3"/>
  <circle cx="380" cy="350" r="2" fill="#E8E4DF" opacity="0.3"/>

  <!-- Small golden cross at top -->
  <g transform="translate(200, 52)">
    <rect x="-2.5" y="-14" width="5" height="28" rx="1.5" fill="url(#goldGrad)"/>
    <rect x="-9" y="-5" width="18" height="5" rx="1.5" fill="url(#goldGrad)"/>
    <circle cx="0" cy="-14" r="3" fill="url(#goldGrad)" opacity="0.8"/>
  </g>

  <!-- === CAKE STAND === -->
  <!-- Stand base plate -->
  <ellipse cx="200" cy="420" rx="90" ry="12" fill="url(#standGrad)" filter="url(#softShadow)"/>
  <ellipse cx="200" cy="418" rx="90" ry="10" fill="#E2DDD8"/>
  <ellipse cx="200" cy="416" rx="88" ry="9" fill="#EDE9E4"/>
  <!-- Stand stem -->
  <rect x="193" y="408" width="14" height="14" rx="4" fill="#D8D4CE"/>
  <!-- Stand top plate -->
  <ellipse cx="200" cy="408" rx="70" ry="8" fill="url(#standGrad)"/>
  <ellipse cx="200" cy="406" rx="70" ry="7" fill="#E8E4DF"/>
  <ellipse cx="200" cy="405" rx="68" ry="6" fill="#F2EFE9"/>

  <!-- === WHITE SATIN BOW === -->
  <!-- Long streamers -->
  <!-- Left streamer -->
  <path d="M180,408 Q155,435 140,460 Q135,470 138,475" stroke="#F5F2EE" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M178,410 Q153,437 138,462 Q133,472 136,477" stroke="#DEDAD5" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- Right streamer -->
  <path d="M220,408 Q245,435 260,460 Q265,470 262,475" stroke="#F5F2EE" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M222,410 Q247,437 262,462 Q267,472 264,477" stroke="#DEDAD5" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Left bow loop -->
  <path d="M200,405 C185,390 155,385 150,395 C145,405 160,415 175,412 C185,410 195,408 200,405Z"
        fill="#F8F6F3" stroke="#E8E4DF" stroke-width="1"/>
  <path d="M200,405 C188,393 162,390 157,398 C152,406 164,413 177,411"
        fill="none" stroke="#DEDAD5" stroke-width="1" opacity="0.7"/>
  <!-- Right bow loop -->
  <path d="M200,405 C215,390 245,385 250,395 C255,405 240,415 225,412 C215,410 205,408 200,405Z"
        fill="#F8F6F3" stroke="#E8E4DF" stroke-width="1"/>
  <path d="M200,405 C212,393 238,390 243,398 C248,406 236,413 223,411"
        fill="none" stroke="#DEDAD5" stroke-width="1" opacity="0.7"/>
  <!-- Bow center knot -->
  <ellipse cx="200" cy="406" rx="9" ry="7" fill="#EDEAE5" stroke="#D8D4CE" stroke-width="0.5"/>
  <ellipse cx="200" cy="406" rx="5" ry="4" fill="#F5F2EE"/>

  <!-- === CAKE DOME BODY === -->
  <!-- Dome shape - main ellipse/circle form -->
  <ellipse cx="200" cy="290" rx="130" ry="135" fill="url(#domeGrad)" filter="url(#domeShadow)"/>

  <!-- === WAFER PAPER PETALS around the dome === -->
  <!-- Bottom row petals -->
  <g opacity="0.9">
    <!-- Row 1 - very bottom -->
    <ellipse cx="130" cy="390" rx="28" ry="16" fill="url(#petalGrad)" stroke="#D8D4CE" stroke-width="0.8" transform="rotate(-30,130,390)"/>
    <ellipse cx="160" cy="400" rx="28" ry="16" fill="url(#petalGrad)" stroke="#D8D4CE" stroke-width="0.8" transform="rotate(-15,160,400)"/>
    <ellipse cx="200" cy="403" rx="28" ry="16" fill="url(#petalGrad)" stroke="#D8D4CE" stroke-width="0.8"/>
    <ellipse cx="240" cy="400" rx="28" ry="16" fill="url(#petalGrad)" stroke="#D8D4CE" stroke-width="0.8" transform="rotate(15,240,400)"/>
    <ellipse cx="270" cy="390" rx="28" ry="16" fill="url(#petalGrad)" stroke="#D8D4CE" stroke-width="0.8" transform="rotate(30,270,390)"/>

    <!-- Row 2 -->
    <ellipse cx="110" cy="370" rx="26" ry="15" fill="url(#petalGrad)" stroke="#DEDAD5" stroke-width="0.8" transform="rotate(-40,110,370)"/>
    <ellipse cx="143" cy="378" rx="26" ry="15" fill="url(#petalGrad)" stroke="#DEDAD5" stroke-width="0.8" transform="rotate(-20,143,378)"/>
    <ellipse cx="172" cy="383" rx="26" ry="15" fill="url(#petalGrad)" stroke="#DEDAD5" stroke-width="0.8" transform="rotate(-8,172,383)"/>
    <ellipse cx="200" cy="385" rx="26" ry="15" fill="url(#petalGrad)" stroke="#DEDAD5" stroke-width="0.8"/>
    <ellipse cx="228" cy="383" rx="26" ry="15" fill="url(#petalGrad)" stroke="#DEDAD5" stroke-width="0.8" transform="rotate(8,228,383)"/>
    <ellipse cx="257" cy="378" rx="26" ry="15" fill="url(#petalGrad)" stroke="#DEDAD5" stroke-width="0.8" transform="rotate(20,257,378)"/>
    <ellipse cx="290" cy="370" rx="26" ry="15" fill="url(#petalGrad)" stroke="#DEDAD5" stroke-width="0.8" transform="rotate(40,290,370)"/>

    <!-- Row 3 -->
    <ellipse cx="95" cy="345" rx="24" ry="14" fill="url(#petalGrad)" stroke="#E0DCDA" stroke-width="0.7" transform="rotate(-50,95,345)"/>
    <ellipse cx="126" cy="357" rx="24" ry="14" fill="url(#petalGrad)" stroke="#E0DCDA" stroke-width="0.7" transform="rotate(-30,126,357)"/>
    <ellipse cx="157" cy="364" rx="24" ry="14" fill="url(#petalGrad)" stroke="#E0DCDA" stroke-width="0.7" transform="rotate(-12,157,364)"/>
    <ellipse cx="200" cy="366" rx="24" ry="14" fill="url(#petalGrad)" stroke="#E0DCDA" stroke-width="0.7"/>
    <ellipse cx="243" cy="364" rx="24" ry="14" fill="url(#petalGrad)" stroke="#E0DCDA" stroke-width="0.7" transform="rotate(12,243,364)"/>
    <ellipse cx="274" cy="357" rx="24" ry="14" fill="url(#petalGrad)" stroke="#E0DCDA" stroke-width="0.7" transform="rotate(30,274,357)"/>
    <ellipse cx="305" cy="345" rx="24" ry="14" fill="url(#petalGrad)" stroke="#E0DCDA" stroke-width="0.7" transform="rotate(50,305,345)"/>

    <!-- Row 4 - sides -->
    <ellipse cx="80" cy="315" rx="22" ry="13" fill="url(#petalGrad)" stroke="#E4E0DD" stroke-width="0.7" transform="rotate(-60,80,315)"/>
    <ellipse cx="108" cy="330" rx="22" ry="13" fill="url(#petalGrad)" stroke="#E4E0DD" stroke-width="0.7" transform="rotate(-42,108,330)"/>
    <ellipse cx="320" cy="315" rx="22" ry="13" fill="url(#petalGrad)" stroke="#E4E0DD" stroke-width="0.7" transform="rotate(60,320,315)"/>
    <ellipse cx="292" cy="330" rx="22" ry="13" fill="url(#petalGrad)" stroke="#E4E0DD" stroke-width="0.7" transform="rotate(42,292,330)"/>

    <!-- Row 5 - upper sides -->
    <ellipse cx="76" cy="280" rx="20" ry="12" fill="url(#petalGrad)" stroke="#E8E4E1" stroke-width="0.6" transform="rotate(-70,76,280)"/>
    <ellipse cx="88" cy="258" rx="20" ry="12" fill="url(#petalGrad)" stroke="#E8E4E1" stroke-width="0.6" transform="rotate(-75,88,258)"/>
    <ellipse cx="324" cy="280" rx="20" ry="12" fill="url(#petalGrad)" stroke="#E8E4E1" stroke-width="0.6" transform="rotate(70,324,280)"/>
    <ellipse cx="312" cy="258" rx="20" ry="12" fill="url(#petalGrad)" stroke="#E8E4E1" stroke-width="0.6" transform="rotate(75,312,258)"/>

    <!-- Row 6 - upper -->
    <ellipse cx="110" cy="232" rx="20" ry="12" fill="url(#petalGrad)" stroke="#ECEAE7" stroke-width="0.6" transform="rotate(-55,110,232)"/>
    <ellipse cx="137" cy="215" rx="20" ry="12" fill="url(#petalGrad)" stroke="#ECEAE7" stroke-width="0.6" transform="rotate(-38,137,215)"/>
    <ellipse cx="290" cy="232" rx="20" ry="12" fill="url(#petalGrad)" stroke="#ECEAE7" stroke-width="0.6" transform="rotate(55,290,232)"/>
    <ellipse cx="263" cy="215" rx="20" ry="12" fill="url(#petalGrad)" stroke="#ECEAE7" stroke-width="0.6" transform="rotate(38,263,215)"/>
  </g>

  <!-- Core dome highlight -->
  <ellipse cx="185" cy="270" rx="75" ry="80" fill="white" opacity="0.35"/>

  <!-- === WHITE DOVE FIGURINE === -->
  <g transform="translate(165, 295)" filter="url(#softShadow)">
    <!-- Tail feathers -->
    <path d="M-5,8 C-12,12 -18,18 -16,24 C-14,28 -8,26 -4,22 C-2,18 -2,14 -5,8Z"
          fill="#F2EFE9" stroke="#DEDAD5" stroke-width="0.5"/>
    <path d="M-4,8 C-10,10 -14,16 -12,22 C-10,26 -5,24 -3,20 C-1,16 -2,12 -4,8Z"
          fill="#FAFAF8" stroke="#E4E0DC" stroke-width="0.5"/>
    <!-- Body -->
    <ellipse cx="8" cy="4" rx="22" ry="13" fill="url(#doveGrad)" stroke="#E0DCDA" stroke-width="0.8"/>
    <!-- Head -->
    <circle cx="28" cy="-4" r="9" fill="url(#doveGrad)" stroke="#E0DCDA" stroke-width="0.8"/>
    <!-- Beak -->
    <path d="M36,-5 L42,-4 L36,-2Z" fill="url(#goldGrad)"/>
    <!-- Eye -->
    <circle cx="31" cy="-5" r="1.8" fill="#3A3530"/>
    <circle cx="31.5" cy="-5.5" r="0.6" fill="white"/>
    <!-- Wing upper -->
    <path d="M12,-6 C18,-16 30,-18 32,-12 C28,-8 20,-6 12,-6Z"
          fill="#F5F2EE" stroke="#DEDAD5" stroke-width="0.7"/>
    <!-- Wing gold tips -->
    <path d="M28,-13 C30,-11 31,-9 30,-7" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M24,-14 C26,-12 27,-10 26,-8" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- Wing lower sweep -->
    <path d="M4,8 C10,0 22,-2 28,-6 C26,0 20,8 10,10 C6,10 4,9 4,8Z"
          fill="#EDE9E4" stroke="#DEDAD5" stroke-width="0.6" opacity="0.8"/>
    <!-- Gold wing accent -->
    <path d="M20,2 C24,-2 28,-4 30,-6" stroke="url(#goldGrad)" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- Foot -->
    <path d="M2,14 L2,18 M2,18 L-2,21 M2,18 L2,22 M2,18 L6,21" stroke="#C9A84C" stroke-width="1" stroke-linecap="round"/>
    <path d="M14,14 L14,18 M14,18 L10,21 M14,18 L14,22 M14,18 L18,21" stroke="#C9A84C" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- === 5-PETAL FLOWER on right side === -->
  <g transform="translate(282, 300)">
    <!-- Petals -->
    <ellipse cx="0" cy="-15" rx="8" ry="12" fill="#FAFAF8" stroke="#E4E0DA" stroke-width="0.8" transform="rotate(0)"/>
    <ellipse cx="0" cy="-15" rx="8" ry="12" fill="#FAFAF8" stroke="#E4E0DA" stroke-width="0.8" transform="rotate(72)"/>
    <ellipse cx="0" cy="-15" rx="8" ry="12" fill="#FAFAF8" stroke="#E4E0DA" stroke-width="0.8" transform="rotate(144)"/>
    <ellipse cx="0" cy="-15" rx="8" ry="12" fill="#FAFAF8" stroke="#E4E0DA" stroke-width="0.8" transform="rotate(216)"/>
    <ellipse cx="0" cy="-15" rx="8" ry="12" fill="#FAFAF8" stroke="#E4E0DA" stroke-width="0.8" transform="rotate(288)"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="6" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="3" fill="#E8C96A"/>
  </g>

  <!-- Small bud on left -->
  <g transform="translate(118, 310)">
    <ellipse cx="0" cy="-10" rx="6" ry="9" fill="#FAFAF8" stroke="#E4E0DA" stroke-width="0.7" transform="rotate(0)"/>
    <ellipse cx="0" cy="-10" rx="6" ry="9" fill="#FAFAF8" stroke="#E4E0DA" stroke-width="0.7" transform="rotate(120)"/>
    <ellipse cx="0" cy="-10" rx="6" ry="9" fill="#FAFAF8" stroke="#E4E0DA" stroke-width="0.7" transform="rotate(240)"/>
    <circle cx="0" cy="0" r="4" fill="url(#goldGrad)"/>
  </g>

  <!-- === ХВ COOKIE / BISCUIT on top === -->
  <g transform="translate(200, 185)" filter="url(#goldGlow)">
    <!-- Cookie backing oval -->
    <ellipse cx="0" cy="0" rx="52" ry="38" fill="#F5F0E8" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="48" ry="34" fill="#FAF7F2" stroke="url(#goldGrad)" stroke-width="1"/>

    <!-- Willow branch decorations in gold/green -->
    <!-- Left branch -->
    <path d="M-42,5 C-34,-2 -28,-8 -20,-10" stroke="#8B9B5A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="-38" cy="3" rx="4" ry="2.5" fill="#8B9B5A" transform="rotate(-30,-38,3)"/>
    <ellipse cx="-32" cy="-1" rx="3.5" ry="2" fill="#A0B068" transform="rotate(-40,-32,-1)"/>
    <ellipse cx="-26" cy="-6" rx="3.5" ry="2" fill="#8B9B5A" transform="rotate(-50,-26,-6)"/>
    <ellipse cx="-38" cy="8" rx="3" ry="2" fill="#A0B068" transform="rotate(-20,-38,8)"/>
    <ellipse cx="-32" cy="4" rx="3" ry="2" fill="#C9A84C" transform="rotate(-30,-32,4)" opacity="0.7"/>

    <!-- Right branch -->
    <path d="M42,5 C34,-2 28,-8 20,-10" stroke="#8B9B5A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="38" cy="3" rx="4" ry="2.5" fill="#8B9B5A" transform="rotate(30,38,3)"/>
    <ellipse cx="32" cy="-1" rx="3.5" ry="2" fill="#A0B068" transform="rotate(40,32,-1)"/>
    <ellipse cx="26" cy="-6" rx="3.5" ry="2" fill="#8B9B5A" transform="rotate(50,26,-6)"/>
    <ellipse cx="38" cy="8" rx="3" ry="2" fill="#A0B068" transform="rotate(20,38,8)"/>
    <ellipse cx="32" cy="4" rx="3" ry="2" fill="#C9A84C" transform="rotate(30,32,4)" opacity="0.7"/>

    <!-- Letter Х -->
    <text x="-18" y="12"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="40"
          font-weight="bold"
          fill="#FAFAF8"
          stroke="url(#goldGrad)"
          stroke-width="2"
          text-anchor="middle"
          paint-order="stroke">Х</text>

    <!-- Letter В -->
    <text x="18" y="12"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="40"
          font-weight="bold"
          fill="#FAFAF8"
          stroke="url(#goldGrad)"
          stroke-width="2"
          text-anchor="middle"
          paint-order="stroke">В</text>
  </g>

  <!-- Small willow sprigs above cookie -->
  <g opacity="0.8">
    <path d="M200,148 C200,140 200,132 200,125" stroke="#8B9B5A" stroke-width="1.5" fill="none"/>
    <ellipse cx="195" cy="138" rx="4" ry="2.5" fill="#A0B068" transform="rotate(-20,195,138)"/>
    <ellipse cx="205" cy="132" rx="4" ry="2.5" fill="#8B9B5A" transform="rotate(20,205,132)"/>
    <ellipse cx="198" cy="128" rx="3" ry="2" fill="#C9A84C" transform="rotate(-10,198,128)" opacity="0.6"/>
  </g>

  <!-- === BOTTOM LABEL === -->
  <g transform="translate(200, 475)">
    <!-- Label background -->
    <rect x="-100" y="-14" width="200" height="22" rx="5" fill="#F5F0E8" opacity="0.7"/>
    <!-- Decorative lines -->
    <line x1="-95" y1="-4" x2="-68" y2="-4" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.7"/>
    <line x1="68" y1="-4" x2="95" y2="-4" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.7"/>
    <text x="0" y="3"
          font-family="'Trebuchet MS', Arial, sans-serif"
          font-size="9.5"
          font-weight="600"
          letter-spacing="2.5"
          fill="#C9A84C"
          text-anchor="middle">WIELKANOCNA BABECZKA</text>
  </g>
</svg>
