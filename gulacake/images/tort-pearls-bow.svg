  <ellipse cx="196" cy="341" rx="4" ry="3" fill="#FFFFFF" opacity="0.3"/>
</g>
<!-- Pearl border at base -->
<g>
  <circle cx="128" cy="402" r="5" fill="url(#pearl)"/><circle cx="146" cy="405" r="5" fill="url(#pearl)"/>
  <circle cx="164" cy="406" r="5" fill="url(#pearl)"/><circle cx="182" cy="407" r="5" fill="url(#pearl)"/>
  <circle cx="200" cy="407" r="5" fill="url(#pearl)"/><circle cx="218" cy="407" r="5" fill="url(#pearl)"/>
