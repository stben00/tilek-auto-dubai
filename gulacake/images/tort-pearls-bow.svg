  <circle cx="218" cy="232" r="7" fill="url(#pearl)"/><circle cx="244" cy="236" r="5" fill="url(#pearl)"/>
  <circle cx="138" cy="248" r="5" fill="url(#pearl)"/><circle cx="174" cy="254" r="5" fill="url(#pearl)"/>
  <circle cx="206" cy="252" r="6" fill="url(#pearl)"/><circle cx="236" cy="256" r="4" fill="url(#pearl)"/>
  <circle cx="160" cy="275" r="4" fill="url(#pearl)"/><circle cx="196" cy="278" r="4" fill="url(#pearl)"/>
  <circle cx="228" cy="276" r="4" fill="url(#pearl)"/>
  <circle cx="180" cy="298" r="3" fill="url(#pearl)"/><circle cx="214" cy="300" r="3" fill="url(#pearl)"/>
