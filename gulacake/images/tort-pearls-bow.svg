<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FBFAF8"/><stop offset="100%" stop-color="#F0EEEA"/></linearGradient>
  <linearGradient id="cake" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#F4F0EC"/></linearGradient>
  <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#B01838"/><stop offset="50%" stop-color="#D8203F"/><stop offset="100%" stop-color="#A01030"/></linearGradient>
  <linearGradient id="standMetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D8D4CC"/><stop offset="50%" stop-color="#B0A89C"/><stop offset="100%" stop-color="#908878"/></linearGradient>
  <radialGradient id="pearl" cx="0.35" cy="0.3" r="0.7"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="60%" stop-color="#F0EDE8"/><stop offset="100%" stop-color="#D8D2C8"/></radialGradient>
  <filter id="sh"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#8a7a6a" flood-opacity="0.18"/></filter>
</defs>
<rect width="400" height="500" fill="url(#bg)"/>
<circle cx="70" cy="100" r="120" fill="#EFEBE4" opacity="0.4"/>
<circle cx="340" cy="410" r="100" fill="#EAE5DC" opacity="0.35"/>
