<g>
  <path d="M200 345 Q170 322 150 330 Q138 336 142 350 Q146 362 168 360 Q188 358 200 345Z" fill="url(#ribbon)" stroke="#8a1028" stroke-width="1"/>
  <path d="M200 345 Q230 322 250 330 Q262 336 258 350 Q254 362 232 360 Q212 358 200 345Z" fill="url(#ribbon)" stroke="#8a1028" stroke-width="1"/>
  <path d="M178 350 L160 392 L172 388 L182 358Z" fill="url(#ribbon)"/>
  <path d="M222 350 L240 392 L228 388 L218 358Z" fill="url(#ribbon)"/>
