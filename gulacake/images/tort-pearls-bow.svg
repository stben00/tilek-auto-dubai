<!-- Gula Cake plate text -->
<text x="200" y="404" font-family="Georgia,serif" font-size="8" fill="#9a9082" text-anchor="middle" letter-spacing="1" opacity="0.7">Gula Cake</text>
<!-- Label -->
<rect x="124" y="466" width="152" height="24" rx="12" fill="rgba(176,24,56,0.10)"/>
<text x="200" y="482" font-family="Georgia,serif" font-size="11" fill="#B01838" text-anchor="middle" letter-spacing="1.5">TORT Z PERŁAMI</text>
