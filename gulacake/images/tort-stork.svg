<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bgGrad3" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#FEFEFE"/>
      <stop offset="100%" stop-color="#F0EDE8"/>
    </radialGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,252,0.7)"/>
      <stop offset="100%" stop-color="rgba(240,235,228,0.1)"/>
    </linearGradient>
    <linearGradient id="tier1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8E4E0"/>
      <stop offset="8%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8F8F8"/>
      <stop offset="92%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0DCE0"/>
    </linearGradient>
    <linearGradient id="tier2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECEAE8"/>
      <stop offset="10%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F9F9F9"/>
      <stop offset="90%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E4E2E0"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8F6F2"/>
      <stop offset="100%" stop-color="#E8E2DA"/>
    </linearGradient>
    <filter id="dropShadow3">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="5"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.55  0 0 0 0 0.5  0 0 0 0.2 0"/>
      <feComposite in2="SourceGraphic"/>
    </filter>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background with window light effect -->
  <rect width="400" height="500" fill="url(#bgGrad3)"/>
  <!-- Window light beam -->
  <rect width="400" height="500" fill="url(#windowGrad)"/>
  <!-- Subtle warm gradient overlay -->
  <radialGradient id="warmFill" cx="50%" cy="100%" r="60%">
    <stop offset="0%" stop-color="rgba(220,210,195,0.2)"/>
    <stop offset="100%" stop-color="transparent"/>
  </radialGradient>
  <rect width="400" height="500" fill="url(#warmFill)"/>

  <!-- ═══ CAKE BOARD / PLATE ═══ -->
  <!-- Board shadow -->
  <ellipse cx="203" cy="446" rx="108" ry="12" fill="rgba(180,165,148,0.3)"/>
  <!-- Board body -->
  <rect x="92" y="432" width="216" height="12" rx="6" fill="url(#plateGrad)" stroke="#D8D0C4" stroke-width="1"/>
  <!-- Board top surface -->
  <ellipse cx="200" cy="432" rx="108" ry="8" fill="url(#plateGrad)" stroke="#D8D0C4" stroke-width="1"/>

  <!-- ═══ BOTTOM TIER ═══ -->
  <!-- Ruffled/pleated texture - bottom tier -->
  <!-- Draw many thin vertical wavy pleats to simulate fondant ruffles -->
  <g opacity="0.9">
    <!-- Base tier body shape -->
    <rect x="102" y="285" width="196" height="148" rx="3" fill="#F8F8F8"/>
    <!-- Pleated texture: alternating highlight/shadow vertical stripes -->
    <!-- Each "pleat" is a light-shadow-light pattern -->
    <rect x="102" y="285" width="7" height="148" rx="1" fill="#E8E4E0" opacity="0.8"/>
    <rect x="109" y="285" width="5" height="148" fill="#FFFFFF" opacity="0.9"/>
    <rect x="114" y="285" width="4" height="148" fill="#F0EDE9" opacity="0.7"/>
    <rect x="118" y="285" width="6" height="148" fill="#FFFFFF" opacity="0.9"/>
    <rect x="124" y="285" width="4" height="148" fill="#ECE8E4" opacity="0.7"/>
    <rect x="128" y="285" width="6" height="148" fill="#FFFFFF" opacity="0.9"/>
    <rect x="134" y="285" width="4" height="148" fill="#EEE9E5" opacity="0.7"/>
    <rect x="138" y="285" width="6" height="148" fill="#FFFFFF" opacity="0.9"/>
    <rect x="144" y="285" width="4" height="148" fill="#EDE8E3" opacity="0.7"/>
    <rect x="148" y="285" width="6" height="148" fill="#FFFFFF" opacity="0.9"/>
    <rect x="154" y="285" width="4" height="148" fill="#EEE9E4" opacity="0.7"/>
    <rect x="158" y="285" width="6" height="148" fill="#FFFFFF" opacity="0.9"/>
    <rect x="164" y="285" width="4" height="148" fill="#F0ECE8" opacity="0.6"/>
    <rect x="168" y="285" width="6" height="148" fill="#FFFFFF" opacity="0.9"/>
    <rect x="174" y="285" width="4" height="148" fill="#F2EEE9" opacity="0.6"/>
    <rect x="178" y="285" width="6" height="148" fill="#FFFFFF" opacity="0.9"/>
    <rect x="184" y="285" width="4" height="148" fill="#F0EDE8" opacity="0.6"/>
    <rect x="188" y="285" width="6" height="148" fill="#FFFFFF" opacity="0.9"/>
    <rect x="194" y="285" width="4" height="148" fill="#F0EDE8" opacity="0.6"/>
    <rect x="198" y="285" width="6" height="148" fill="#FFFFFF" opacity="0.9"/>
    <rect x="204" y="285" width="4" height="148" fill="#F0EDE8" opacity="0.6"/>
    <rect x="208" y="285" width="6" height="148" fill="#FFFFFF" opacity="0.9"/>
    <rect x="214" y="285" width="4" height="148" fill="#EEE9E4" opacity="0.7"/>
    <rect x="218" y="285" width="6" height="148" fill="#FFFFFF" opacity="0.9"/>
    <rect x="224" y="285" width="4" height="148" fill="#ECE8E3" opacity="0.7"/>
    <rect x="228" y="285" width="6" height="148" fill="#FFFFFF" opacity="0.9"/>
    <rect x="234" y="285" width="4" height="148" fill="#ECE7E2" opacity="0.7"/>
    <rect x="238" y="285" width="6" height="148" fill="#FFFFFF" opacity="0.9"/>
    <rect x="244" y="285" width="4" height="148" fill="#EDE8E3" opacity="0.7"/>
    <rect x="248" y="285" width="6" height="148" fill="#FFFFFF" opacity="0.9"/>
    <rect x="254" y="285" width="4" height="148" fill="#EAE6E1" opacity="0.7"/>
    <rect x="258" y="285" width="6" height="148" fill="#FFFFFF" opacity="0.9"/>
    <rect x="264" y="285" width="4" height="148" fill="#E8E4DF" opacity="0.8"/>
    <rect x="268" y="285" width="6" height="148" fill="#FFFFFF" opacity="0.9"/>
    <rect x="274" y="285" width="4" height="148" fill="#E8E4E0" opacity="0.8"/>
    <rect x="278" y="285" width="7" height="148" fill="#E4E0DC" opacity="0.8"/>
    <rect x="285" y="285" width="13" height="148" rx="2" fill="#E0DCD8" opacity="0.7"/>
    <!-- Wavy top of pleats -->
    <path d="M102,290 C107,285 112,292 117,287 C122,282 127,289 132,284 C137,279 142,286 147,281 C152,276 157,283 162,278 C167,273 172,280 177,276 C182,272 187,278 192,274 C197,270 202,276 207,272 C212,268 217,274 222,270 C227,266 232,272 237,268 C242,264 247,270 252,266 C257,262 262,268 267,264 C272,260 277,266 282,262 C287,258 293,265 298,261" stroke="rgba(200,190,180,0.4)" stroke-width="1" fill="none"/>
  </g>

  <!-- Bottom tier top ellipse -->
  <ellipse cx="200" cy="285" rx="98" ry="10" fill="#F5F2EE" stroke="#E8E4E0" stroke-width="1"/>

  <!-- ═══ GOLD SCRIPT ON BOTTOM TIER ═══ -->
  <text x="200" y="350" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#C9A84C" filter="url(#glow3)" letter-spacing="0.3">Таїнство</text>
  <text x="200" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#C9A84C" filter="url(#glow3)" letter-spacing="0.3">Хрещення</text>
  <text x="200" y="394" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C9A84C" filter="url(#glow3)" letter-spacing="0.5">Лавріна</text>

  <!-- Gold divider ornament -->
  <line x1="148" y1="403" x2="182" y2="403" stroke="#C9A84C" stroke-width="0.6" opacity="0.5"/>
  <line x1="218" y1="403" x2="252" y2="403" stroke="#C9A84C" stroke-width="0.6" opacity="0.5"/>
  <circle cx="200" cy="403" r="2" fill="none" stroke="#C9A84C" stroke-width="0.8" opacity="0.6"/>
  <circle cx="193" cy="403" r="1" fill="#C9A84C" opacity="0.5"/>
  <circle cx="207" cy="403" r="1" fill="#C9A84C" opacity="0.5"/>

  <!-- ═══ TOP TIER ═══ -->
  <!-- Top tier shadow under -->
  <ellipse cx="201" cy="288" rx="70" ry="8" fill="rgba(180,168,152,0.2)"/>
  <!-- Top tier body - smooth plain white -->
  <rect x="132" y="175" width="136" height="112" rx="4" fill="url(#tier2Grad)" stroke="#EEE9E4" stroke-width="0.8"/>
  <!-- Top tier highlight -->
  <rect x="134" y="178" width="30" height="108" rx="4" fill="rgba(255,255,255,0.5)" opacity="0.5"/>
  <!-- Top tier right shadow -->
  <rect x="234" y="178" width="18" height="108" rx="3" fill="rgba(205,198,188,0.2)"/>
  <!-- Top tier ellipse top -->
  <ellipse cx="200" cy="175" rx="68" ry="8" fill="#FDFDFD" stroke="#EEE9E4" stroke-width="0.8"/>
  <!-- Top tier ellipse bottom border -->
  <ellipse cx="200" cy="287" rx="68" ry="7" fill="#F5F2EE" stroke="#E8E4E0" stroke-width="0.8"/>

  <!-- ═══ STORK FIGURINE ═══ -->
  <g transform="translate(200, 165)">
    <!-- Stork legs -->
    <line x1="-6" y1="15" x2="-8" y2="38" stroke="#E8A030" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="4" y1="15" x2="6" y2="38" stroke="#E8A030" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Feet -->
    <path d="M-8,38 L-14,40 M-8,38 L-8,43 M-8,38 L-3,40" stroke="#E8A030" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <path d="M6,38 L0,40 M6,38 L6,43 M6,38 L11,40" stroke="#E8A030" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Stork body - white egg shape -->
    <ellipse cx="0" cy="5" rx="22" ry="18" fill="white" stroke="#E8E8E8" stroke-width="0.8"/>
    <!-- Body highlight -->
    <ellipse cx="-6" cy="-2" rx="8" ry="10" fill="rgba(255,255,255,0.8)" opacity="0.6"/>

    <!-- Wing - left/back (black tips) -->
    <path d="M-22,5 C-35,-8 -40,-22 -30,-28 C-22,-32 -12,-20 -8,-8 C-14,-16 -28,-18 -22,5 Z" fill="#E8E8E8" stroke="#D8D8D8" stroke-width="0.5"/>
    <path d="M-30,-28 C-35,-30 -42,-28 -40,-22 C-38,-18 -32,-20 -30,-28 Z" fill="#2C2C2C"/>
    <path d="M-22,-20 C-28,-22 -34,-20 -32,-15" stroke="#3C3C3C" stroke-width="1" fill="none" opacity="0.7"/>

    <!-- Wing - right/back -->
    <path d="M22,5 C35,-8 40,-22 30,-28 C22,-32 12,-20 8,-8 C14,-16 28,-18 22,5 Z" fill="#E8E8E8" stroke="#D8D8D8" stroke-width="0.5"/>
    <path d="M30,-28 C35,-30 42,-28 40,-22 C38,-18 32,-20 30,-28 Z" fill="#2C2C2C"/>
    <path d="M22,-20 C28,-22 34,-20 32,-15" stroke="#3C3C3C" stroke-width="1" fill="none" opacity="0.7"/>

    <!-- Black wing accent patches on body sides -->
    <path d="M-20,8 C-22,2 -18,-4 -12,-2 C-18,-4 -20,5 -20,8 Z" fill="#2C2C2C" opacity="0.85"/>
    <path d="M20,8 C22,2 18,-4 12,-2 C18,-4 20,5 20,8 Z" fill="#2C2C2C" opacity="0.85"/>

    <!-- Neck -->
    <path d="M-6,-12 C-5,-25 5,-28 8,-18 C5,-25 2,-22 0,-12 Z" fill="white" stroke="#E8E8E8" stroke-width="0.5"/>

    <!-- Head -->
    <circle cx="2" cy="-32" r="12" fill="white" stroke="#E8E8E8" stroke-width="0.8"/>
    <!-- Eye -->
    <circle cx="8" cy="-35" r="3" fill="#1C1C1C"/>
    <circle cx="9" cy="-36" r="1" fill="white"/>
    <!-- Black eye mask -->
    <path d="M-2,-38 C2,-42 10,-40 12,-36 C10,-40 2,-42 -2,-38 Z" fill="#2C2C2C"/>

    <!-- Long orange beak holding bundle -->
    <path d="M14,-32 L52,-22 L14,-28 Z" fill="#E8A030"/>
    <line x1="14" y1="-32" x2="52" y2="-22" stroke="#D89020" stroke-width="0.5"/>

    <!-- Baby bundle in beak -->
    <g transform="translate(54,-20)">
      <!-- White wrap/swaddle bundle -->
      <ellipse cx="0" cy="0" rx="14" ry="10" fill="white" stroke="#E8E4E0" stroke-width="0.8"/>
      <!-- Bundle knot/bow at top -->
      <path d="M-5,-9 C-3,-14 3,-14 5,-9 C3,-13 -3,-13 -5,-9 Z" fill="white" stroke="#E8E4E0" stroke-width="0.6"/>
      <!-- Bundle wrap lines -->
      <path d="M-10,2 Q0,6 10,2" stroke="#E0DCDA" stroke-width="0.7" fill="none" opacity="0.6"/>
      <path d="M-8,-3 Q0,1 8,-3" stroke="#E0DCDA" stroke-width="0.7" fill="none" opacity="0.4"/>
      <!-- Tiny baby face peeking -->
      <circle cx="-2" cy="0" r="4" fill="#F8D5C0" stroke="#E8C0A8" stroke-width="0.5"/>
      <path d="M-4,-1 Q-2,-3 0,-1" stroke="#C09880" stroke-width="0.5" fill="none"/>
    </g>
  </g>

  <!-- ═══ BOTTOM LABEL ═══ -->
  <text x="200" y="472" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#9A9288" letter-spacing="1.5">TORT NA CHRZEST</text>
  <text x="200" y="484" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#C9A84C" letter-spacing="2" opacity="0.8">· 2-TIER ·</text>
  <line x1="145" y1="462" x2="255" y2="462" stroke="rgba(180,168,152,0.4)" stroke-width="0.5"/>
</svg>
